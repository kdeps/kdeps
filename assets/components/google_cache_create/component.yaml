apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: google_cache_create
  description: Create a Google AI cached content entry through the kdeps API
  version: "1.0.1"
interface:
  inputs:
    - name: model
      type: string
      required: true
      description: Gemini model name
    - name: content
      type: string
      required: true
      description: Text to cache as a system prompt
    - name: ttl
      type: string
      description: Cache TTL as a Go duration. Default 1h
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Create cache
    httpClient:
      method: POST
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/google_cache_create/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 60s
      data:
        model: "{{ get('google_cache_create.model') }}"
        content: "{{ get('google_cache_create.content') }}"
        ttl: "{{ get('google_cache_create.ttl') }}"
