apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: task_stop
  description: Stop a task through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: task_id
      type: string
      required: true
      description: Task id to stop
  # body is the stopped-task sentence. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Stop task
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/task_stop/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        task_id: "{{ get('task_stop.task_id') }}"
