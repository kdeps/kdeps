# Shelves are the catalog words assets are filed under. tools/registrygen
# turns this file into pkg/assets/shelves_gen.go. Edit here, then run
# make generate. The model never sees a shelf; kdeps list and the published
# index carry it.

# Shelf order is the catalog order.
shelves:
  - model
  - context
  - harness
  - tools
  - memory
  - rag
  - agent
  - guardrails
  - evals
  - workflow
  - deploy

# sets: the shelf a set's items use unless items below names one.
sets:
  models: model
  providers: model
  recipes: model
  presets: context
  harness: harness
  tools: tools
  commands: agent
  themes: agent
  events: guardrails
  policy: guardrails
  actions: guardrails
  schemas: workflow
  templates: workflow
  components: workflow
  defaults: workflow
  docker: deploy
  k8s: deploy
  memory: memory

# items: a shelf other than its set's default. The key is set/name.
items:
  "commands/model": model
  "harness/branch-summary": context
