apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: hf_repo_files
  description: List a HuggingFace repo's GGUF files through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: repo
      type: string
      required: true
      description: The repo id, e.g. Qwen/Qwen3-8B-GGUF
  # body is the table. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: List repo files
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/hf_repo_files/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 60s
      data:
        repo: "{{ get('hf_repo_files.repo') }}"
