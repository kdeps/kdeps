apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: team_add_task
  description: Add a task to a team through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: team_id
      type: string
      required: true
      description: Team that receives the task
    - name: task_id
      type: string
      required: true
      description: Task id to add
  # body is the added-task sentence. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Add task
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/team_add_task/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        team_id: "{{ get('team_add_task.team_id') }}"
        task_id: "{{ get('team_add_task.task_id') }}"
