# OpenAI-compatible LLM provider: kdeps registers a chat backend named after
# this file and reads its key from llm.openrouter_api_key in ~/.kdeps/config.yaml.
version: 1.0.0
name: openrouter
label: OpenRouter
order: 100                # position in provider lists and the setup prompt
configKey: openrouter_api_key
envVar: OPENROUTER_API_KEY
url: https://openrouter.ai
chatPath: /api/v1/chat/completions
embeddings: true          # also serves OpenAI-compatible /embeddings
hosts: [openrouter.ai]
