apiVersion: kdeps.io/v1
kind: Workflow

metadata:
  name: docker-config-example
  description: Example showing Docker configuration features
  version: 1.0.0
  targetActionId: response

deploy:

  apiServer:
    portNum: 16395
    routes:
      - path: /api/v1/chat
        methods: [POST]

  runtime:
    timezone: "UTC"
    pythonVersion: "3.12"

    # Base OS for Docker build (alpine or ubuntu)
    # --gpu forces ubuntu; otherwise workflow baseOS wins over CLI default
    baseOS: "alpine"

    # Install Ollama for local LLM support

    # Python packages to install
    pythonPackages:
      - requests
      - numpy
      - pandas

    # OS-level packages to install
    # For alpine: apk packages
    # For ubuntu: apt packages
    osPackages:
      - git
      - vim
      - curl
      - jq

    # LLM models to download (optional)

resources:
  - actionId: llm
    name: LLM Chat
    chat:
      model:
        name: llama3.2:1b
      context:
        # Backend will be auto-detected and installed in Docker image
        # Local backend: ollama (default). Online providers: openai, anthropic, google, cohere, mistral, together, perplexity, groq, deepseek
        role: "user"
        prompt: "{{ get('q') }}"

  - actionId: response
    name: API Response
    workflow:
      requires: [llm]
    apiResponse:
      success: true
      response:
        answer: "{{ get('llm').message.content }}"
