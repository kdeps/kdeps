apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: code_symbols
  description: List symbols in a file through the kdeps API
  version: "1.0.1"
interface:
  inputs:
    - name: path
      type: string
      required: true
      description: File to read
  # body is the handler text. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: List symbols in a file
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/code_symbols/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        path: "{{ get('code_symbols.path') }}"
