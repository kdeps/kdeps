actionId: fetch
name: Fetch Page
validations:
  methods: [POST]
  routes: [/summarize]
  check:
    - get('url') != ''
  error:
    code: 400
    message: "url is required"
component:
  name: scraper                          # YAML component from the components asset set
  with:
    url: "{{ get('url') }}"
    selector: "{{ get('selector', '') }}"  # empty: the whole body
    timeout: 30s
