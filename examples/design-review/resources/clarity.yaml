actionId: clarity
name: Review (clarity)

# Skipped when the request carries no doc (an answer to the question).
validations:
  skip:
    - "get('doc') == nil"

# Reads only the request, so the four reviewers run at the same time.
chat:
  model:
    name: llama3.2:1b
    timeout: 120s
  context:
    prompt: |
      You review design documents for one criterion only.
      Criterion (clarity): A developer who has not seen the discussion can follow it. Every term is defined, every component and file is named, no decision is left unwritten.
      Reply with JSON only: {"pass": true|false, "findings": ["..."]}

      Design document:
      {{ get('doc') }}
  harness:
    output:
      json: true
      keys: [pass, findings]
