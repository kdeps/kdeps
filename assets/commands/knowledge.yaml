version: 2.0.3
# kdeps update installs these with this command: what its run steps use
requires:
  tools/session_ops: ""
name: knowledge
order: 71
usage:
  - args: ""
    help: Show whether the knowledge vault is on, and where it is
  - args: "on"
    help: Turn on per-turn recall, session notes and the knowledge tools (remembered)
  - args: "off"
    help: Turn them off for this and later sessions
  - args: "build [auto|manual|off]"
    help: Show or set model graph building (manual by default; auto also runs it in the background; off disables it)
  - args: extract
    help: Read the changed notes with the auxiliary model and update the graph
subcommands:
  "":
    run:
      - tool: session_ops
        args: {operation: knowledge}
        print: |-
          knowledge vault is {{if eq .value "on"}}on{{else}}off - `/knowledge on` to enable{{end}}
            vault: {{.vault}}
            graph: {{.graph}}
            build: {{.build}}
            {{if .pending}}{{.pending}} notes waiting for extraction (`/knowledge extract` or `kdeps knowledge build --extract`){{end}}
  state:
    setting:
      key: knowledge
      values: ["on", "off"]
      show: "knowledge vault is {{.value}}"
      set: >-
        {{if eq .value "on"}}knowledge vault on - each turn recalls related notes; this session writes its note{{else}}knowledge vault off - no recall, no session note, knowledge tools refuse{{end}}
      invalid: "Usage: /knowledge [on|off|extract]"
  "on":
    run:
      - command: /knowledge state on
  "off":
    run:
      - command: /knowledge state off
  build:
    setting:
      key: knowledge-build
      values: [auto, manual, off]
      show: >-
        {{if eq .value "auto"}}model graph building is automatic - the auxiliary model reads changed notes at session end and before a background build{{else if eq .value "off"}}model graph building is off{{else}}model graph building is manual - it runs when you use /knowledge extract or kdeps knowledge build --extract{{end}}
      set: >-
        {{if eq .value "auto"}}model graph building set to automatic{{else if eq .value "off"}}model graph building turned off{{else}}model graph building set to manual{{end}}
      invalid: "Usage: /knowledge build [auto|manual|off]"
  extract:
    run:
      - tool: session_ops
        args: {operation: knowledge}  # a quick first step, so this line shows before the long one
        print: Reading changed notes with the auxiliary model...
      - tool: session_ops
        args: {operation: knowledge_extract}
        print: "{{.output}}"
