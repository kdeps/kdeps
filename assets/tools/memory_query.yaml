version: 1.2.0
description: 'Run a relational query over agent state. Relations: `memory` (persistent memory entries: key, value, namespace, type, references, createdAt, updatedAt), `tool_calls` (recent tool call history: name, args (the arguments as an object, e.g. .args.command), args_json (the raw text), result, timestamp), `tasks` (active goal''s task list: id, desc, status, rounds, note). Query language is expr-lang: filter(relation, predicate) selects rows (e.g. filter(memory, .type == "error")), map(relation, expr) projects fields, join(left, right, leftField, rightField) equi-joins two relations into rows with left_/right_ prefixed fields, union(a, b) combines two relations with set semantics. String operators are infix: .value contains "x", .value startsWith "x", .value endsWith "x", .value matches "regex"; lower()/upper() are functions (lower(.value)); membership is .key in ["a", "b"]. A list field such as references is tested with in: "fact:x" in .references (contains works on text only).'
parameters:
  limit:
    type: integer
    description: Max rows returned when the result is a relation (capped by the memory-query-rows-max event, 500)
    default: 50
  query:
    type: string
    description: expr-lang expression over the memory/tool_calls/tasks relations
    required: true
