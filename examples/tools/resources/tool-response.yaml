actionId: toolResponse
name: Tool Response
workflow:
    requires:
        - llmWithTools

guardrails:
  methods: [POST]
  routes: [/api/v1/tools]
apiResponse:
  success: true
  response:
    query: "{{ get('q') }}"
    llm_response: "{{ get('llmWithTools').message.content }}"
    tools_available: true
