apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: team_list
  description: List teams through the kdeps API
  version: "1.0.1"
interface:
  inputs: []
  # body is one line per team, or No teams. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: List teams
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/team_list/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data: {}
