apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: code_symbols
  description: List a file's symbols through the kdeps API
  version: "1.1.0"
interface:
  inputs:
    - name: path
      type: string
      required: true
      description: File to read
    - name: pattern
      type: string
      description: File glob filter, for example "*.go" (ripgrep fallback only)
    - name: language
      type: string
      description: ripgrep --type value, for example go (ripgrep fallback only)
    - name: languageId
      type: string
      description: Explicit LSP language ID. Auto-detected from the path extension if omitted
    - name: context
      type: number
      default: 0
      description: Lines of context before and after each match (ripgrep fallback only)
    - name: limit
      type: number
      default: 0
      description: Maximum results per file (ripgrep fallback only). 0 = unlimited
  # body is the handler text. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: List symbols
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/code_symbols/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        path: "{{ get('code_symbols.path') }}"
        pattern: "{{ get('code_symbols.pattern') }}"
        language: "{{ get('code_symbols.language') }}"
        languageId: "{{ get('code_symbols.languageId') }}"
        context: "{{ get('code_symbols.context') }}"
        limit: "{{ get('code_symbols.limit') }}"
