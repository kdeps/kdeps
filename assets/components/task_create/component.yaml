apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: task_create
  description: Create a task through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: prompt
      type: string
      required: true
      description: Work the task should do
    - name: description
      type: string
      required: true
      description: Short label stored on the task
  # body is the created-task sentence. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Create task
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/task_create/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        prompt: "{{ get('task_create.prompt') }}"
        description: "{{ get('task_create.description') }}"
