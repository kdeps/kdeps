apiVersion: kdeps.io/v1
kind: Workflow

metadata:
  name: page-summarizer
  version: "1.0.0"
  description: "Summarize the current browser page. WASM + bookmarklet."
  targetActionId: response

settings:
  agentSettings:
    timezone: UTC
    env:
      KDEPS_DEFAULT_BACKEND: openai      # WASM rejects local backends; the drawer can change it
      KDEPS_WASM_CAPTURE: "url,title,text"  # emit the standard "send this page" bookmarklet + receiver
