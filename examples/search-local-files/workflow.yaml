apiVersion: kdeps.io/v1
kind: Workflow
metadata:
  name: search-local-files
  description: Local filesystem search through the search_local component and the kdeps API
  version: "1.0.0"
  targetActionId: response
deploy:
  apiServer:
    portNum: 16404
    routes:
      - path: /search
        methods: [POST]
  runtime:
    timezone: Etc/UTC
    pythonVersion: "3.12"
