version: 1.0.0
description: 'Change Airtable records: PATCH a JSON body to https://api.airtable.com/v0/PATH and return the JSON. Fields not in the body stay as they are. Requires AIRTABLE_TOKEN, AIRTABLE_API_KEY or the vault secret airtable_token.'
parameters:
  path:
    type: string
    description: 'The API path after https://api.airtable.com/v0/. Examples: BASE_ID/TABLE, BASE_ID/TABLE/RECORD_ID.'
    required: true
  body:
    type: object
    description: 'The JSON request body. Example: {"fields": {"Status": "Done"}}.'
    required: true
http:
  env:
    TOKEN: [AIRTABLE_TOKEN, AIRTABLE_API_KEY, "secret:airtable_token"]
  method: PATCH
  # The host is fixed; path only adds to it.
  url: 'https://api.airtable.com/v0/{{trimPrefix .args.path "/"}}'
  headers:
    Authorization: 'Bearer {{.env.TOKEN}}'
    User-Agent: kdeps
    Content-Type: application/json
  body: '{{json .args.body}}'
