version: 1.0.0
description: 'Read the Discord API: GET https://discord.com/api/v10/PATH and return the JSON. Use it for channels, messages, guilds and users. Requires DISCORD_BOT_TOKEN or the vault secret discord_bot_token.'
parameters:
  path:
    type: string
    description: 'The API path after https://discord.com/api/v10/, with its query string. Examples: channels/CHANNEL_ID/messages?limit=20, users/@me.'
    required: true
http:
  env:
    TOKEN: [DISCORD_BOT_TOKEN, "secret:discord_bot_token"]
  method: GET
  # The host is fixed; path only adds to it.
  url: 'https://discord.com/api/v10/{{trimPrefix .args.path "/"}}'
  headers:
    Authorization: 'Bot {{.env.TOKEN}}'
    User-Agent: 'DiscordBot (https://kdeps.com, 1)'
