apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: tail_file
  description: Read the last lines of a file through the kdeps API
  version: "1.0.1"
interface:
  inputs:
    - name: file_path
      type: string
      required: true
      description: Path of the file to tail
    - name: lines
      type: number
      description: How many lines from the end to return. Empty uses 20
  # body is the numbered tail. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Tail file
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/tail_file/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        file_path: "{{ get('tail_file.file_path') }}"
        lines: "{{ get('tail_file.lines') }}"
