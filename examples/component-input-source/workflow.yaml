apiVersion: kdeps.io/v1
kind: Workflow

metadata:
  name: component-input-source
  description: |
    A reusable text-transformation sub-workflow designed to be called via
    a component: resource from a parent workflow.

    Declares sources: [api] with no apiServer, so no HTTP server, bot
    listener, or file reader is started.  All input arrives through the
    calling resource's with: map.

    Inputs (passed by the parent's component: with: map):
      - text    (required) - the text to transform
      - style   (optional) - "uppercase" | "lowercase" | "title"  (default: uppercase)

    Output:
      component result stored under the calling actionId;
      access with output('<callerActionId>') or get('<callerActionId>').

    To invoke from a parent workflow:
      component:
        name: component-input-source
        with:
          text: "hello world"
          style: title
  version: "1.0.0"
  targetActionId: transform

settings:
  agentSettings:
    pythonVersion: "3.12"
  input:
    sources: [api]   # component calls deliver the with: map; no server starts without apiServer
