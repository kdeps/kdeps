apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: bash_job_list
  description: List background shell jobs through the kdeps API
  version: "1.0.0"
interface:
  inputs: []
  # body is the job list, or the empty-list sentence. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: List jobs
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/bash_job_list/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data: {}
