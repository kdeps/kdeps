version: 1.0.1
# kdeps update installs these with this command: what its run steps use
requires:
  commands/efficiency: ""
  presets/frugal: ""
name: frugal
order: 500
# A declared command: kdeps runs the steps under run: in order. A step is
# either another slash command or a prompt sent to the model; both take the
# command's arguments as $1, $2, ... and $ARGUMENTS.
usage:
  - args: ""
    help: Spend fewer tokens - apply the frugal preset to every token-economy event
run:
  - command: /efficiency preset frugal
