apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: edit_file
  description: Edit a file through the kdeps API and return the changed snippet
  version: "2.0.0"
interface:
  inputs:
    - name: file_path
      type: string
      required: true
      description: Path of the file to edit
    - name: line
      type: number
      description: 1-based line to edit, or to append after
    - name: match
      type: string
      description: Words on the line to edit. Without line, the first line containing them
    - name: text
      type: string
      description: Replacement for the line, or for match on the line
    - name: append
      type: string
      description: Text inserted after the line, or at the end of the file
  # body is the edited line(s), numbered. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Edit file
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/edit_file/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        file_path: "{{ get('edit_file.file_path') }}"
        line: "{{ get('edit_file.line') }}"
        match: "{{ get('edit_file.match') }}"
        text: "{{ get('edit_file.text') }}"
        append: "{{ get('edit_file.append') }}"
