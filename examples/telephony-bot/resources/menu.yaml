actionId: menuChoice
name: Menu Choice
validations:
  routes: [/twilio/menu]
component:
  name: twiml
  with:
    verbs:
      # Digits is the key from the welcome menu's gather.
      - redirect: "{{ get('Digits') == '1' ? '/twilio/hours' : get('Digits') == '2' ? '/twilio/ask' : '/twilio/voice' }}"
