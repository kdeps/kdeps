# OpenAI-compatible LLM provider: kdeps registers a chat backend named after
# this file and reads its key from llm.maritaca_api_key in ~/.kdeps/config.yaml.
version: 1.0.0
name: maritaca
label: Maritaca
order: 140                # position in provider lists and the setup prompt
configKey: maritaca_api_key
envVar: MARITACA_API_KEY
url: https://chat.maritaca.ai
chatPath: /api/chat/inference
hosts: [maritaca.ai]
