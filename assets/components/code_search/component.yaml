apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: code_search
  description: Search for a symbol through the kdeps API
  version: "1.1.0"
interface:
  inputs:
    - name: path
      type: string
      required: true
      description: File or directory to search
    - name: query
      type: string
      required: true
      description: Symbol name or search pattern
    - name: pattern
      type: string
      description: File glob filter, for example "*.go" (ripgrep fallback only)
    - name: language
      type: string
      description: ripgrep --type value, for example go (ripgrep fallback only)
    - name: languageId
      type: string
      description: Explicit LSP language ID. Auto-detected from the path extension if omitted
    - name: context
      type: number
      default: 0
      description: Lines of context before and after each match (ripgrep fallback only)
    - name: limit
      type: number
      default: 0
      description: Maximum results per file (ripgrep fallback only). 0 = unlimited
  # body is the handler text. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Search for a symbol
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/code_search/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        path: "{{ get('code_search.path') }}"
        query: "{{ get('code_search.query') }}"
        pattern: "{{ get('code_search.pattern') }}"
        language: "{{ get('code_search.language') }}"
        languageId: "{{ get('code_search.languageId') }}"
        context: "{{ get('code_search.context') }}"
        limit: "{{ get('code_search.limit') }}"
