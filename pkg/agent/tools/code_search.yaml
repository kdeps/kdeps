version: 1.0.0
description: 'Search for a symbol or pattern across the codebase. Use this first to locate symbols before using code_definition or code_references. Requires: query, path.'
parameters:
  path:
    type: string
    description: File or directory to search (absolute path)
    required: true
  query:
    type: string
    description: Symbol name or search pattern
    required: true
