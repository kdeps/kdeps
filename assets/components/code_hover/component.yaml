apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: code_hover
  description: Get symbol documentation through the kdeps API
  version: "1.1.0"
interface:
  inputs:
    - name: path
      type: string
      required: true
      description: File containing the symbol
    - name: symbol
      type: string
      required: true
      description: Symbol name
    - name: languageId
      type: string
      description: Explicit LSP language ID. Auto-detected from the path extension if omitted
  # body is the handler text. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Get symbol documentation
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/code_hover/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        path: "{{ get('code_hover.path') }}"
        symbol: "{{ get('code_hover.symbol') }}"
        languageId: "{{ get('code_hover.languageId') }}"
