name: frugal
description: >-
  Minimizes token usage: compacts and folds history sooner, injects far
  less memory context, truncates tool output harder, and caps tool-call
  budgets tighter. Best for cost-sensitive sessions or a small-context-
  window local model.
events:
  - name: auto-compact
    on:
      tokens: 8000
      ctxWindowFraction: 0.5
      minTurns: 2
    run: compact
  - name: fold
    on:
      tokensSinceCheckpoint: 500
      minTurns: 2
    items: 3
    run: compact
  - name: memory-prompt-limit
    on:
      tokens: 150
    run: truncate
  - name: memory-keys-limit
    items: 20
    run: cap
  - name: memory-focus-max
    items: 2
    run: cap
  - name: memory-chain-max
    items: 3
    run: cap
  - name: rel-memory-limit
    items: 100
    run: cap
  - name: tool-result-truncate
    on:
      bytes: 4096
    run: truncate
  - name: tool-error-truncate
    on:
      bytes: 200
    run: truncate
  - name: force-answer-digest
    on:
      bytes: 4096
    run: truncate
  - name: history-window-trim
    on:
      bytes: 8192
    run: drop_oldest
  - name: web-call-budget
    on:
      distinctCalls: 8
    run: block
  - name: bash-call-budget
    on:
      distinctCalls: 20
    run: block
  - name: file-call-budget
    on:
      distinctCalls: 30
    run: block
  - name: code-call-budget
    on:
      distinctCalls: 12
    run: block
