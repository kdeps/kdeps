version: 1.1.0
description: 'Get compiler/linter diagnostics for a file. Returns errors, warnings, hints. Requires: path. Optional: pattern, languageId.'
parameters:
  path:
    type: string
    description: File to check (absolute path)
    required: true
  pattern:
    type: string
    description: Package pattern for go vet, for example ./... (Go files with no LSP server)
  languageId:
    type: string
    description: Explicit LSP language ID (go, python, rust, typescript, javascript, c, cpp, ruby, java). Auto-detected from the path extension if omitted
