apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: transcribe
  description: Transcribe audio or video to text with a Whisper API or offline with whisper.cpp
  version: "1.1.1"
interface:
  inputs:
    - name: file
      type: string
      required: true
      description: Path to the audio/video file. API backends take mp3, mp4, mpeg, mpga, m4a, wav, webm; whisper-cpp takes flac, mp3, ogg, wav.
    - name: backend
      type: string
      default: openai
      description: openai, groq, local (a self-hosted OpenAI-compatible Whisper server) or whisper-cpp (offline, no API key)
    - name: model
      type: string
      default: whisper-1
      description: API model (groq - whisper-large-v3); ignored by whisper-cpp
    - name: baseURL
      type: string
      default: ""
      description: Overrides the backend's API base URL (API backends only)
    - name: language
      type: string
      default: ""
      description: ISO-639-1 code, e.g. en; empty = auto-detect (whisper-cpp defaults to en)
    - name: prompt
      type: string
      default: ""
      description: Spelling hints for names and terms (API backends)
    - name: responseFormat
      type: string
      default: text
      description: text, json, verbose_json, srt or vtt (API backends)
    - name: temperature
      type: string
      default: ""
      description: Sampling temperature 0-1 (API backends)
    - name: modelPath
      type: string
      default: ""
      description: whisper-cpp GGML model; empty = ggml-base.en.bin, downloaded once to the models dir
resources:
  # Each step is one call to a kdeps API tool route: the component holds no
  # HTTP client or exec of its own.
  - actionId: transcribeAPI
    name: Transcribe (Whisper API)
    validations:
      skip:
        - "get('transcribe.backend') == 'whisper-cpp'"
    httpClient:
      method: POST
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/transcribe_audio/call
      headers:
        Content-Type: application/json
      timeout: 300s
      failOnError: true
      data:
        file: "{{ get('transcribe.file') }}"
        backend: "{{ get('transcribe.backend') }}"
        model: "{{ get('transcribe.model') }}"
        baseURL: "{{ get('transcribe.baseURL') }}"
        language: "{{ get('transcribe.language') }}"
        prompt: "{{ get('transcribe.prompt') }}"
        responseFormat: "{{ get('transcribe.responseFormat') }}"
        temperature: "{{ get('transcribe.temperature') }}"
  # whisper-cpp: fetch the default model once, then run whisper-cli offline.
  - actionId: transcribeModel
    name: Download whisper.cpp model
    validations:
      skip:
        - "get('transcribe.backend') != 'whisper-cpp' || get('transcribe.modelPath') != '' || fileExists(env('KDEPS_MODELS_DIR', env('HOME') + '/.kdeps/models') + '/ggml-base.en.bin')"
    httpClient:
      method: POST
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/http_request/call
      headers:
        Content-Type: application/json
      timeout: 900s
      failOnError: true
      data:
        url: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
        method: GET
        saveTo: "{{ env('KDEPS_MODELS_DIR', env('HOME') + '/.kdeps/models') }}/ggml-base.en.bin"
        timeout: 900s
        failOnError: true
  - actionId: transcribeOffline
    name: Transcribe (whisper.cpp)
    validations:
      skip:
        - "get('transcribe.backend') != 'whisper-cpp'"
    httpClient:
      method: POST
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/transcribe_audio_offline/call
      headers:
        Content-Type: application/json
      timeout: 600s
      failOnError: true
      data:
        file: "{{ get('transcribe.file') }}"
        language: "{{ get('transcribe.language') }}"
        modelPath: "{{ get('transcribe.modelPath') }}"
