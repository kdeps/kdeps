version: 1.2.0
description: 'Extract text from an image via tesseract OCR. Runs entirely locally -- no API key required. Supports png, jpg/jpeg, tiff, bmp, gif. Requires: file (absolute path to the image). Optional: language (tesseract -l value, e.g. ''eng'' or ''eng+fra''; default ''eng''), psm (page segmentation mode, default 3), oem (engine mode, default 3). Does not support PDF -- use load_document with type pdf for text-layer PDFs.'
parameters:
  file:
    type: string
    description: Absolute path to the image to extract text from
    required: true
  language:
    type: string
    description: 'tesseract -l value, e.g. ''eng'' or ''eng+fra''. Default: eng'
    default: eng
  psm:
    type: integer
    description: 'tesseract --psm page segmentation mode (3 = fully automatic)'
    default: 3
  oem:
    type: integer
    description: 'tesseract --oem engine mode (3 = whatever is available)'
    default: 3
exec:
  command: tesseract
  install: tesseract-ocr
  paths: [file]               # checked against the workspace boundary
  args:
    - "{{.args.file}}"
    - stdout                  # tesseract writes the text to stdout
    - "-l"
    - "{{.args.language}}"
    - "--psm"
    - "{{.args.psm}}"
    - "--oem"
    - "{{.args.oem}}"
