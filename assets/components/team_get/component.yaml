apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: team_get
  description: Read a team through the kdeps API
  version: "1.0.1"
interface:
  inputs:
    - name: team_id
      type: string
      required: true
      description: Team id, for example team-1
  # body is the team text. An unknown id is an error. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Read team
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/team_get/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        team_id: "{{ get('team_get.team_id') }}"
