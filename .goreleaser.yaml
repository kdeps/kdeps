version: 2
before:
  hooks:
    - go mod tidy

builds:
  - binary: kdeps
    main: ./
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/kdeps/kdeps/v2/pkg/version.Version={{ .Version }} -X github.com/kdeps/kdeps/v2/pkg/version.Commit={{ .Commit }}
      - >-
        {{- if eq .Os "linux" }}-linkmode external -extldflags "-static"{{- end }}
    flags:
      - -trimpath
      - -buildvcs=false
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Os "darwin" }}SDKROOT={{ .Env.SDK_PATH }}{{- end }}
      - >-
        {{- if eq .Os "darwin" }}MACOSX_DEPLOYMENT_TARGET=11.0{{- end }}
      - >-
        {{- if eq .Os "darwin" }}CGO_CFLAGS=-isysroot {{ .Env.SDK_PATH }} -mmacosx-version-min=11.0{{- end }}
      - >-
        {{- if eq .Os "darwin" }}CGO_CXXFLAGS=-isysroot {{ .Env.SDK_PATH }} -mmacosx-version-min=11.0{{- end }}
      - >-
        {{- if eq .Os "darwin" }}CGO_LDFLAGS=-isysroot {{ .Env.SDK_PATH }}{{- end }}
      - >-
        {{- if eq .Os "darwin" }}
          {{- if eq .Arch "amd64"}}CC=clang -arch x86_64 -isysroot {{ .Env.SDK_PATH }}{{- end }}
          {{- if eq .Arch "arm64"}}CC=clang -arch arm64 -isysroot {{ .Env.SDK_PATH }}{{- end }}
        {{- else if eq .Os "linux" }}
          {{- if eq .Arch "amd64" }}CC=zig cc -target x86_64-linux-musl -lc{{- end }}
          {{- if eq .Arch "arm64"}}CC=zig cc -target aarch64-linux-musl -lc{{- end }}
        {{- else if eq .Os "windows" }}
          {{- if eq .Arch "amd64" }}CC=zig cc -target x86_64-windows-gnu -lc{{- end }}
        {{- end }}
      - >-
        {{- if eq .Os "darwin" }}
          {{- if eq .Arch "amd64"}}CXX=clang++ -arch x86_64 -isysroot {{ .Env.SDK_PATH }}{{- end }}
          {{- if eq .Arch "arm64"}}CXX=clang++ -arch arm64 -isysroot {{ .Env.SDK_PATH }}{{- end }}
        {{- else if eq .Os "linux" }}
          {{- if eq .Arch "amd64" }}CXX=zig c++ -target x86_64-linux-musl -lc{{- end }}
          {{- if eq .Arch "arm64"}}CXX=zig c++ -target aarch64-linux-musl -lc{{- end }}
        {{- else if eq .Os "windows" }}
          {{- if eq .Arch "amd64" }}CXX=zig c++ -target x86_64-windows-gnu -lc{{- end }}
        {{- end }}

release:
  make_latest: true
  prerelease: false

# SPDX SBOM per archive (syft). Consumers can audit exactly which modules
# ship in each release artifact.
sboms:
  - artifacts: archive

# Keyless cosign signature over the checksum file (Sigstore OIDC via the
# workflow's id-token permission). Verifying checksums.txt against the
# .cosign.bundle transitively verifies every artifact hash in it.
# cosign 2.6+ signs to a self-contained bundle (cert + signature + tlog
# entry); verify with:
#   cosign verify-blob --new-bundle-format \
#     --bundle checksums.txt.cosign.bundle \
#     --certificate-identity-regexp 'github.com/kdeps/kdeps' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.cosign.bundle"
    output: true
    args:
      - sign-blob
      - --new-bundle-format
      - --bundle=${signature}
      - ${artifact}
      - --yes

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: kdeps
    skip_upload: false
    commit_author:
      name: jjuliano
      email: joelbryan.julianoe@gmail.com
    directory: Formula
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://kdeps.com"
    description: "Kdeps is a framework for creating dockerized AI Agent APIs"
    dependencies:
      - name: git
    repository:
      owner: kdeps
      name: homebrew-tap

nfpms:
  - id: kdeps-pkg
    package_name: kdeps
    homepage: https://kdeps.com
    maintainer: Joel Bryan Juliano <joelbryan.juliano@gmail.com>
    description: "Kdeps is a framework for creating dockerized AI Agent APIs"
    vendor: Kdeps
    license: Apache-2.0 license
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    dependencies:
      - git

scoops:
  - name: kdeps
    homepage: "https://kdeps.com"
    description: "Kdeps is a framework for creating dockerized AI Agent APIs"
    license: Apache-2.0
    directory: bucket
    commit_author:
      name: jjuliano
      email: joelbryan.juliano@gmail.com
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    repository:
      owner: kdeps
      name: scoop-bucket
      token: "{{ .Env.GITHUB_TOKEN }}"

# AUR and winget publish only when their credentials exist as repo secrets
# (AUR_KEY: ssh private key of the AUR maintainer; WINGET_TOKEN: PAT that can
# push to the kdeps/winget-pkgs fork and open PRs on microsoft/winget-pkgs).
# Without a secret the workflow passes an empty string and the entry is skipped.
aurs:
  - name: kdeps-bin
    skip_upload: '{{ if .Env.AUR_KEY }}false{{ else }}true{{ end }}'
    homepage: "https://kdeps.com"
    description: "Kdeps is a framework for creating dockerized AI Agent APIs"
    license: Apache-2.0
    maintainers:
      - "Joel Bryan Juliano <joelbryan.juliano@gmail.com>"
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/kdeps-bin.git"
    depends:
      - git
    commit_author:
      name: jjuliano
      email: joelbryan.juliano@gmail.com
    commit_msg_template: "kdeps-bin {{ .Tag }}"

winget:
  - name: kdeps
    skip_upload: '{{ if .Env.WINGET_TOKEN }}false{{ else }}true{{ end }}'
    package_identifier: Kdeps.Kdeps
    publisher: Kdeps
    publisher_url: https://kdeps.com
    short_description: "Kdeps is a framework for creating dockerized AI Agent APIs"
    license: Apache-2.0
    homepage: https://kdeps.com
    commit_author:
      name: jjuliano
      email: joelbryan.juliano@gmail.com
    repository:
      owner: kdeps
      name: winget-pkgs
      branch: "kdeps-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
