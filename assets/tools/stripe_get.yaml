version: 1.0.0
description: 'Read the Stripe API: GET https://api.stripe.com/v1/PATH and return the JSON. Use it for customers, payments, invoices, subscriptions and balance. Requires STRIPE_SECRET_KEY, STRIPE_API_KEY or the vault secret stripe_secret_key.'
parameters:
  path:
    type: string
    description: 'The API path after https://api.stripe.com/v1/, with its query string. Examples: customers?limit=10, payment_intents/PI_ID, balance.'
    required: true
http:
  env:
    TOKEN: [STRIPE_SECRET_KEY, STRIPE_API_KEY, "secret:stripe_secret_key"]
  method: GET
  # The host is fixed; path only adds to it.
  url: 'https://api.stripe.com/v1/{{trimPrefix .args.path "/"}}'
  headers:
    Authorization: 'Bearer {{.env.TOKEN}}'
    User-Agent: kdeps
