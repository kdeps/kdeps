apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: ocr
  description: Extract text from an image with the tesseract CLI through the kdeps API
  version: "1.1.1"
  targetActionId: call
interface:
  inputs:
    - name: file
      type: string
      required: true
      description: Path to the image (png, jpg, tiff, bmp, gif). PDFs with a text layer go through the loader resource instead.
    - name: language
      type: string
      default: eng
      description: tesseract -l value, e.g. eng or eng+fra
    - name: psm
      type: integer
      default: 3
      description: tesseract --psm page segmentation mode (3 = fully automatic)
    - name: oem
      type: integer
      default: 3
      description: tesseract --oem engine mode (3 = whatever is available)
  # The exec result shape the component always returned. The tool asset
  # (ocr_image) declares the tesseract call; the kdeps API runs it.
  output:
    stdout: "{{ output('call').body }}"
    stderr: ""
    exitCode: 0
    success: true
setup:
  osPackages:
    - tesseract-ocr          # the kdeps API host runs tesseract
  provides:
    - tesseract              # already on PATH: no package manager runs
resources:
  - actionId: call
    name: OCR
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/ocr_image/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 60s
      data:
        file: "{{ get('ocr.file') }}"
        language: "{{ get('ocr.language') }}"
        psm: "{{ get('ocr.psm') }}"
        oem: "{{ get('ocr.oem') }}"
