<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="kGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00B8D4"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background pill -->
  <rect x="0" y="10" width="400" height="100" rx="20" fill="#0D1117"/>

  <!-- Glowing 'k' -->
  <text x="40" y="82" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace" font-size="64" font-weight="700" fill="url(#kGlow)" filter="url(#softGlow)">k</text>

  <!-- 'deps' -->
  <text x="100" y="82" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace" font-size="64" font-weight="700" fill="#E6EDF3">deps</text>

  <!-- Tagline -->
  <text x="40" y="100" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#8B949E" letter-spacing="2">AI WORKFLOWS · LOCAL FIRST</text>
</svg>
