apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: cron_list
  description: List cron jobs through the kdeps API
  version: "1.0.0"
interface:
  inputs: []
  # body is one line per cron job, or No cron jobs. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: List cron jobs
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/cron_list/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data: {}
