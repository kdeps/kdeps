apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: notion_patch
  description: Update Notion pages and blocks through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: path
      type: string
      required: true
      description: The API path after https://api.notion.com/v1/ (pages/PAGE_ID, blocks/BLOCK_ID/children)
    - name: body
      type: object
      required: true
      description: 'The JSON request body, for example {"archived": true} to archive a page'
  # The Notion reply, parsed from JSON. No NOTION_TOKEN, NOTION_API_KEY or vault secret notion_token is an error.
  output: "{{ fromJSON(output('call').body) }}"
resources:
  - actionId: call
    name: Notion PATCH
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/notion_patch/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 60s
      data:
        path: "{{ get('notion_patch.path') }}"
        body: "{{ get('notion_patch.body') }}"
