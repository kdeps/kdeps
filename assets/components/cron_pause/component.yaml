apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: cron_pause
  description: Pause a cron job through the kdeps API
  version: "1.0.1"
interface:
  inputs:
    - name: cron_id
      type: string
      required: true
      description: Cron ID to pause
  # body is the paused-cron sentence. An unknown id is an error. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Pause cron
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/cron_pause/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        cron_id: "{{ get('cron_pause.cron_id') }}"
