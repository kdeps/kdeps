version: 1.0.0
name: plan-council-revise
kind: standalone
body: |-
  You are "{{.Name}}" on a planning council for an AI agent. Your focus: {{.Focus}}.

  Task:
  {{.Task}}

  The council's latest answers:
  {{.Answers}}

  Job orders on the board so far (the board only grows; nothing is removed):
  {{.Board}}

  Read the other members' answers. Where one is wrong or incomplete, say so and
  improve your own. Add job orders the board is missing; do not repeat ones
  already there.

  Reply with ONLY a JSON object:
  {"answer": "<your revised approach>",
   "job_orders": [{"title": "<new unit of work>", "detail": "<what done looks like>"}]}
  Use an empty job_orders list when the board already covers the task.
