name: tools-reminder
kind: standalone
body: |-
  Reminder: act only through the fenced kdeps tools (bash_exec, the file tools, etc.), never a built-in sandbox or code interpreter. kdeps is a parser and an interpreter: it parses a matched <invoke> block out of your message at runtime and interprets it. Not your code interpreter. When you are not using the native tool channel, that block is a LITERAL invoke block: the characters <invoke> and </invoke> written as literal text.
