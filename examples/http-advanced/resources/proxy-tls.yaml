actionId: proxyTls
name: Proxy and TLS Configuration

validations:
  methods: [GET]
  routes: [/api/v1/http-demo]

component:
  name: http_request
  with:
    method: GET
    url: "https://httpbin.org/get"
    headers:
      User-Agent: "KDeps-Advanced-HTTP/1.0"

    # Proxy configuration comes from a named connection in ~/.kdeps/config.yaml:
    #   http_connections:
    #     corporate-proxy:
    #       proxy: "http://proxy.company.com:8080"
    # then set connectionName: corporate-proxy here.

    # TLS configuration
    tls:
      # Skip certificate verification (use with caution!)
      insecureSkipVerify: false

      # Custom certificates (uncomment if needed)
      # certFile: "/path/to/client.crt"
      # keyFile: "/path/to/client.key"
      # caFile: "/path/to/ca.crt"

    # No redirects
    followRedirects: false

    # Aggressive retry for demonstration
    retry:
      maxAttempts: 2
      backoff: 100ms
      retryOn: [408, 429, 500, 502, 503, 504]
