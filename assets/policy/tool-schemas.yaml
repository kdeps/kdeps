version: 1.1.0
name: tool-schemas
# Which tool definitions go on every model request. Each definition is
# re-sent on every tool round, so 70+ definitions cost ~12k tokens a round.
# Tools listed under core always send their full definition. Every other
# registered tool is named in load_tools' description; the model calls
# load_tools first, and the definition is sent from the next round on.
# Any tool can still be called without loading it. The project's own
# workflows, components and agencies are always sent in full.
# Delete this file to send every definition on every request.
core:
  - bash_exec
  - read_file
  - write_file
  - edit_file
  - list_files
  - search_local
  - tail_file
  - memory_query
  - memory_save
  - memory_search
  - web_search
  - web_scraper
  - load_skill
  - load_tools
  - session_handshake
  - judge_verdict
  - subagent       # skill packs that start reviewers look for it by role
