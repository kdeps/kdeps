name: Release Desktop

# Builds the desktop app natively per OS and attaches it to a GitHub release.
# Runs when goreleaser (release.yml) publishes a release, or by hand for an
# existing tag: gh workflow run release-desktop.yml -f tag=v2.53.0

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the desktop builds to (e.g. v2.53.0)
        required: true

permissions:
  contents: write

jobs:
  desktop:
    name: desktop (${{ matrix.os }}-${{ matrix.goarch }})
    if: "!contains(github.event.release.tag_name || inputs.tag, '-nightly')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goarch: arm64
            tags: desktop,production
            ldflags: -s -w
            cgo_ldflags: -framework UniformTypeIdentifiers
          # Intel Mac: cross-compiled on the arm64 runner (clang targets x86_64).
          - os: macos-latest
            goarch: amd64
            tags: desktop,production
            ldflags: -s -w
            cgo_ldflags: -framework UniformTypeIdentifiers
          - os: ubuntu-latest
            goarch: amd64
            tags: desktop,production,webkit2_41
            ldflags: -s -w
          - os: windows-latest
            goarch: amd64
            tags: desktop,production
            ldflags: -s -w -H windowsgui
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      VERSION: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build and package
        env:
          CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
          CGO_ENABLED: ${{ runner.os == 'macOS' && '1' || '' }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          v="${VERSION#v}"
          mkdir -p dist/desktop
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          (cd desktop && go build -tags "${{ matrix.tags }}" -ldflags "${{ matrix.ldflags }}" \
            -o "../dist/desktop/kdeps-desktop${ext}" .)
          case "$RUNNER_OS" in
            macOS)
              desktop/packaging/macos/package.sh dist/desktop/kdeps-desktop "$v" dist/desktop "${{ matrix.goarch }}" ;;
            Linux)
              cp desktop/packaging/linux/kdeps-desktop.desktop desktop/packaging/linux/kdeps.png dist/desktop/
              tar -C dist/desktop -czf "dist/desktop/kdeps-desktop_${v}_linux_amd64.tar.gz" kdeps-desktop kdeps-desktop.desktop kdeps.png ;;
            Windows)
              (cd dist/desktop && 7z a -tzip "kdeps-desktop_${v}_windows_amd64.zip" kdeps-desktop.exe) ;;
          esac
      - name: Upload to the release
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist/desktop
          files=(kdeps-desktop_*.dmg kdeps-desktop_*.tar.gz kdeps-desktop_*.zip)
          [ "${#files[@]}" -gt 0 ] || { echo "no desktop package produced" >&2; exit 1; }
          assets=()
          for f in "${files[@]}"; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
            assets+=("$f" "$f.sha256")
          done
          gh release upload "$VERSION" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
