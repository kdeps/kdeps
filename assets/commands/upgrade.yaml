version: 1.0.1
name: upgrade
order: 270
# builtin: kdeps handles this command itself; this file names the operation
# that runs it in api:, and supplies its help, aliases and completion.
builtin: true
api: upgrade
usage:
  - args: ""
    help: Check for and install the latest stable kdeps release
  - args: nightly
    help: Check for and install the latest nightly kdeps build
  - args: "<version>"
