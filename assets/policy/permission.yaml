version: 1.4.6
name: permission
# The one tool policy. Each tool names a tier; each tier names the permission
# mode it needs. A tool not listed uses default.
#   allow  unlisted tools need workspace-write (the behaviour before this file)
#   deny   unlisted tools need danger-full-access, so only that mode runs them
default: allow
tiers:
  T0: read-only        # reversible, self-contained: reads and searches
  T1: workspace-write  # reversible, team-visible: writes, commands, requests
  T2: ask              # irreversible: a person approves each call
  T3: token            # regulated or external reach: needs a capability token from `kdeps token grant` (none by default)
tools:
  calculator: T0
  read_file: T0
  list_files: T0
  web_search: T0
  web_scraper: T0
  wikipedia: T0
  search_local: T0
  load_document: T0
  transcribe_audio: T0
  ocr_image: T0
  sql_query: T0          # read-only statements are enforced by the tool
  sql_list_tables: T0
  sql_describe_table: T0
  wolfram_alpha: T0
  retrieve_context: T0
  exa_search: T0
  cohere_rerank: T0
  voyageai_rerank: T0
  jina_rerank: T0
  zapier_list_actions: T0
  github_get: T0
  slack_get: T0
  notion_get: T0
  airtable_get: T0
  stripe_get: T0
  jira_get: T0
  telegram_get: T0
  discord_get: T0
  slack_socket_open: T0   # opens the Socket Mode connection of the slack_events listener
  google_cache_list: T0
  bash_job_list: T0
  subagent: T0           # the subagent it starts gets only T0 tools
  ask_question: T0       # shows a question and ends the turn
  bash_exec: T1
  write_file: T1
  edit_file: T1
  bash_job_wait: T1
  http_request: T1       # can POST or mutate remote state
  zapier_run_action: T1
  github_post: T1         # creates issues, comments and pull requests
  slack_post: T1          # sends, updates and deletes messages
  notion_post: T1         # creates pages (also search and database queries)
  notion_patch: T1        # updates and archives pages and blocks
  airtable_post: T1
  airtable_patch: T1
  jira_post: T1           # creates issues and comments, moves issue status
  jira_put: T1
  telegram_post: T1       # sends, edits and deletes messages
  discord_post: T1        # sends messages and reactions
  google_cache_create: T1
  google_cache_delete: T1
  stripe_post: T2         # can charge, refund and move money
# Workflow stages. Every run checks each stage's primary kind against these
# tiers before the stage runs, so an operator's KDEPS_PERMISSION_MODE also
# limits workflows. A kind not listed uses default.
resources:
  chat: T0
  embedding: T0
  searchLocal: T0
  loader: T0
  vectorStore: T0
  httpClient: T1      # a request can change remote state
  python: T1
  exec: T1
  agent: T1
  component: T1
