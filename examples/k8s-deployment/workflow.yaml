apiVersion: kdeps.io/v1
kind: Workflow
metadata:
  name: k8s-example
  description: "A workflow that scales to zero on Kubernetes, with resource limits."
  version: 1.0.0
  targetActionId: main

deploy:
  apiServer:
    portNum: 16395
    routes:
      - path: /api/v1/ask
        methods: [POST]
  scale:
    min: 0          # scale to zero: the first request starts a pod
    max: 3          # at most 3 pods
    idle: 5m        # keep the last pod 5m after the last request
  runtime:
    resources:
      cpuLimit: "1000m"
      memoryLimit: "1Gi"
      cpuRequest: "500m"
      memoryRequest: "512Mi"
    
    # Environment variables will be mapped to K8s container env
    env:
      APP_MODE: production
      DATABASE_URL: "postgres://user:pass@db-service:5432/mydb"

resources:
  - actionId: main
    name: Deployment assistant
    chat:
      model:
        name: llama3.2:1b
      context:
        scenario:
          - role: system
            prompt: "You are a Kubernetes deployment assistant."
        prompt: "{{ get('q') }}"
    apiResponse:
      success: true
      response:
        answer: "{{ get('main') }}"
