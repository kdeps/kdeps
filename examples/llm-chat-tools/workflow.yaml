apiVersion: kdeps.io/v1
kind: Workflow

metadata:
  name: llm-chat-tools
  description: Interactive LLM chat with 9 built-in tools (stdin REPL)
  version: "1.0.0"
  targetActionId: chat

deploy:
  input:
    sources: [api]
  runtime:
    timezone: Etc/UTC
    pythonVersion: "3.12"
agent:
  executionType: stdin
  prompt: "You: "
  sessionId: "chat-tools-session"


