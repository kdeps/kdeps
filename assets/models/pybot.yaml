# PyBot: a rule-based chatbot in plain Python, with no model weights
# (https://github.com/huggingface/pybot, Apache-2.0). A chat that names no
# model runs on it. It ignores system prompts and does not call tools.
# Hand-maintained; bump version on change.
version: 1.0.0
pybot:
  alias: pybot
  # A pinned commit: kdeps downloads it on first use, checks sha256, and
  # extracts it to ~/.kdeps/models/<dir>.
  url: "https://codeload.github.com/huggingface/pybot/tar.gz/7d63c7fbebb44c7e466e5c8b5c1f341ab767929e"
  sha256: "dd64eb19e7e4c89fe11155aa9d71cfa6fd2633637433ade526eeac352035d287"
  dir: "pybot-7d63c7fbebb44c7e466e5c8b5c1f341ab767929e"
  # The local server kdeps starts: python3 <this script> --root <dir> --port <port>.
  # It serves PyBot as an OpenAI-compatible chat API, like a llamafile.
  python: |
    """Serve PyBot as an OpenAI-compatible chat API on 127.0.0.1.

    Usage: python3 serve.py --root <pybot folder> --port <port>
    PyBot reads only the user turns. It ignores system prompts and tools.
    """
    import argparse
    import hashlib
    import json
    import sys
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    MAX_REPLAY = 20  # user turns replayed when a conversation is not cached


    def text_of(content):
        if isinstance(content, str):
            return content
        if isinstance(content, list):
            return " ".join(p.get("text", "") for p in content if isinstance(p, dict))
        return ""


    def key_of(turns):
        return hashlib.sha256(json.dumps(turns).encode()).hexdigest()


    class Bot:
        def __init__(self, runtime):
            self.runtime = runtime
            self.lock = threading.Lock()
            self.cache = {}  # transcript hash -> PyBot memory dict

        def turn(self, text, memory):
            try:
                result = self.runtime.turn(text, memory)
                return " ".join(str(result["reply"]).split()) or "Hello!"
            except Exception:  # noqa: BLE001 - PyBot's own rule: a turn never raises
                return "Hello!"

        def reply(self, messages):
            turns = [
                {"role": m.get("role"), "text": text_of(m.get("content"))}
                for m in messages
                if m.get("role") in ("user", "assistant")
            ]
            if not turns or turns[-1]["role"] != "user":
                return "Hello!"
            with self.lock:
                memory = self.cache.pop(key_of(turns[:-1]), None)
                if memory is None:
                    memory = {}
                    for t in [t for t in turns[:-1] if t["role"] == "user"][-MAX_REPLAY:]:
                        self.turn(t["text"], memory)
                answer = self.turn(turns[-1]["text"], memory)
                self.cache[key_of(turns + [{"role": "assistant", "text": answer}])] = memory
                while len(self.cache) > 64:
                    self.cache.pop(next(iter(self.cache)))
                return answer


    def make_handler(bot):
        class Handler(BaseHTTPRequestHandler):
            def log_message(self, *args):
                pass

            def send_json(self, code, body):
                data = json.dumps(body).encode()
                self.send_response(code)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)

            def do_GET(self):
                if self.path == "/health":
                    self.send_json(200, {"status": "ok"})
                elif self.path.rstrip("/") in ("/v1/models", "/models"):
                    self.send_json(200, {"object": "list", "data": [{"id": "pybot", "object": "model"}]})
                else:
                    self.send_json(404, {"error": {"message": "not found"}})

            def do_POST(self):
                if self.path.rstrip("/") not in ("/v1/chat/completions", "/chat/completions"):
                    self.send_json(404, {"error": {"message": "not found"}})
                    return
                try:
                    req = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))) or b"{}")
                except ValueError:
                    self.send_json(400, {"error": {"message": "invalid JSON"}})
                    return
                answer = bot.reply(req.get("messages") or [])
                cid, now, model = "chatcmpl-pybot-%d" % time.time_ns(), int(time.time()), req.get("model") or "pybot"
                if not req.get("stream"):
                    self.send_json(200, {
                        "id": cid, "object": "chat.completion", "created": now, "model": model,
                        "choices": [{"index": 0, "finish_reason": "stop",
                                     "message": {"role": "assistant", "content": answer}}],
                        "usage": {"prompt_tokens": 0, "completion_tokens": len(answer.split()),
                                  "total_tokens": len(answer.split())},
                    })
                    return
                self.send_response(200)
                self.send_header("Content-Type", "text/event-stream")
                self.send_header("Cache-Control", "no-cache")
                self.end_headers()
                for delta, finish in (({"role": "assistant", "content": answer}, None), ({}, "stop")):
                    chunk = {"id": cid, "object": "chat.completion.chunk", "created": now, "model": model,
                             "choices": [{"index": 0, "delta": delta, "finish_reason": finish}]}
                    self.wfile.write(("data: " + json.dumps(chunk) + "\n\n").encode())
                self.wfile.write(b"data: [DONE]\n\n")
                self.wfile.flush()

        return Handler


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--root", required=True)
        ap.add_argument("--port", type=int, required=True)
        args = ap.parse_args()
        sys.path.insert(0, args.root)
        from bot import runtime  # the first import compiles every module and takes a while

        ThreadingHTTPServer(("127.0.0.1", args.port), make_handler(Bot(runtime))).serve_forever()


    if __name__ == "__main__":
        main()
