name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-nightly*'

permissions:
  contents: write
  packages: write
  id-token: write # keyless cosign signing (Sigstore OIDC)

jobs:
  release:
    if: "!contains(github.ref_name, '-nightly')"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # Release binaries embed the committed llamafile registry
      # (refreshed and committed by the nightly workflow) for reproducible builds.
      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2

      - name: Get macOS SDK path
        id: macos_sdk
        run: echo "path=$(xcrun --show-sdk-path)" >> $GITHUB_OUTPUT

      - name: Install syft and cosign (SBOM + signing)
        run: brew install syft cosign

      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: latest
          args: release --clean
        env:
          SDK_PATH: ${{ steps.macos_sdk.outputs.path }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Trigger build-server redeploy
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: kdeps/kdeps-io
          event-type: kdeps-release
          client-payload: '{"version": "${{ github.ref_name }}"}'

  # Desktop app: built natively per OS (CGO + WebView) and attached to the
  # release goreleaser just created, so installers sit next to the CLI archives.
  desktop:
    name: desktop (${{ matrix.os }})
    needs: release
    if: "!contains(github.ref_name, '-nightly')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tags: desktop,production
            ldflags: -s -w
            cgo_ldflags: -framework UniformTypeIdentifiers
          - os: ubuntu-latest
            tags: desktop,production,webkit2_41
            ldflags: -s -w
          - os: windows-latest
            tags: desktop,production
            ldflags: -s -w -H windowsgui
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build and package
        env:
          CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
        run: |
          set -euo pipefail
          v="${VERSION#v}"
          mkdir -p dist/desktop
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          (cd desktop && go build -tags "${{ matrix.tags }}" -ldflags "${{ matrix.ldflags }}" \
            -o "../dist/desktop/kdeps-desktop${ext}" .)
          case "$RUNNER_OS" in
            macOS)
              desktop/packaging/macos/package.sh dist/desktop/kdeps-desktop "$v" dist/desktop ;;
            Linux)
              tar -C dist/desktop -czf "dist/desktop/kdeps-desktop_${v}_linux_amd64.tar.gz" kdeps-desktop ;;
            Windows)
              (cd dist/desktop && 7z a -tzip "kdeps-desktop_${v}_windows_amd64.zip" kdeps-desktop.exe) ;;
          esac
      - name: Upload to the release
        run: |
          set -euo pipefail
          cd dist/desktop
          files=$(ls kdeps-desktop_*.dmg kdeps-desktop_*.tar.gz kdeps-desktop_*.zip 2>/dev/null)
          for f in $files; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          gh release upload "$VERSION" $files $(for f in $files; do echo "$f.sha256"; done) \
            --clobber --repo "$GITHUB_REPOSITORY"
