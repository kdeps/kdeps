version: 1.0.0
description: 'Call the Notion API: POST a JSON body to https://api.notion.com/v1/PATH and return the JSON. Use it to search, query databases and create pages. Requires NOTION_TOKEN, NOTION_API_KEY or the vault secret notion_token.'
parameters:
  path:
    type: string
    description: 'The API path after https://api.notion.com/v1/. Examples: search, databases/DATABASE_ID/query, pages.'
    required: true
  body:
    type: object
    description: 'The JSON request body. Example for a search: {"query": "roadmap"}.'
    required: true
http:
  env:
    TOKEN: [NOTION_TOKEN, NOTION_API_KEY, "secret:notion_token"]
  method: POST
  # The host is fixed; path only adds to it.
  url: 'https://api.notion.com/v1/{{trimPrefix .args.path "/"}}'
  headers:
    Authorization: 'Bearer {{.env.TOKEN}}'
    Notion-Version: '2022-06-28'
    User-Agent: kdeps
    Content-Type: application/json
  body: '{{json .args.body}}'
