apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: airtable_patch
  description: Update Airtable records through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: path
      type: string
      required: true
      description: 'The API path after https://api.airtable.com/v0/. Examples: BASE_ID/TABLE, BASE_ID/TABLE/RECORD_ID.'
    - name: body
      type: object
      required: true
      description: 'The JSON request body. Example: {"fields": {"Status": "Done"}}.'
  # The Airtable reply, parsed from JSON. A missing token is an error that names its sources.
  output: "{{ fromJSON(output('call').body) }}"
resources:
  - actionId: call
    name: Airtable PATCH
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/airtable_patch/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 60s
      data:
        path: "{{ get('airtable_patch.path') }}"
        body: "{{ get('airtable_patch.body') }}"
