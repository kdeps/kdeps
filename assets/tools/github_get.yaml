version: 1.0.0
description: 'Read the GitHub REST API: GET https://api.github.com/PATH and return the JSON. Use it for repositories, issues, pull requests, commits, files and search. Requires GITHUB_TOKEN, GH_TOKEN or the vault secret github_token.'
parameters:
  path:
    type: string
    description: 'The API path after https://api.github.com/, with its query string. Examples: repos/OWNER/REPO/issues?state=open, search/issues?q=repo:OWNER/REPO+is:pr, user.'
    required: true
http:
  env:
    TOKEN: [GITHUB_TOKEN, GH_TOKEN, "secret:github_token"]
  method: GET
  # The host is fixed; path only adds to it.
  url: 'https://api.github.com/{{trimPrefix .args.path "/"}}'
  headers:
    Accept: application/vnd.github+json
    Authorization: 'Bearer {{.env.TOKEN}}'
    User-Agent: kdeps
    X-GitHub-Api-Version: '2022-11-28'
