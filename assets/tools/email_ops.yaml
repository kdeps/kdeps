version: 1.0.0
description: 'Send email over SMTP and read, search, modify, list or delete IMAP mailboxes. SMTP and IMAP settings come from named connections in config.yaml smtp_connections and imap_connections. Actions: send, read, search, modify, list, delete.'
parameters:
  action:
    type: string
    description: 'send (default), read, search, modify, list or delete'
  smtpConnection:
    type: string
    description: Name under smtp_connections in ~/.kdeps/config.yaml (send)
  imapConnection:
    type: string
    description: Name under imap_connections in ~/.kdeps/config.yaml (the IMAP actions)
  from:
    type: string
    description: Sender address (send). Defaults to identity.email in config.yaml
  to:
    type: array
    description: Recipients (send) - a list, or one comma-separated string
  cc:
    type: array
    description: Cc recipients (send)
  bcc:
    type: array
    description: Bcc recipients (send); not written to the headers
  subject:
    type: string
    description: Subject (send)
  body:
    type: string
    description: Message body (send)
  html:
    type: boolean
    description: 'Send the body as text/html. Default: false'
  attachments:
    type: array
    description: File paths to attach (send); relative paths resolve against the workflow directory
  mailbox:
    type: string
    description: Mailbox (default INBOX); required for delete
  limit:
    type: integer
    description: 'Messages to return at most (read, search). Default: 10'
  markRead:
    type: boolean
    description: 'Mark returned messages as seen (read, search). Default: false'
  uids:
    type: array
    description: Message UIDs to modify; empty means every message the search criteria match
  search:
    type: object
    description: 'Criteria for search and modify: from, subject, body, since, before (YYYY-MM-DD), unseen, flagged'
  modify:
    type: object
    description: 'Changes for modify: markSeen, markFlagged, markDeleted (true/false), moveTo, expunge'
  timeout:
    type: string
    description: 'Connection timeout as a duration. Default: 30s'
