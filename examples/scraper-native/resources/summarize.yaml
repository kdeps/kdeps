actionId: summarize
name: Summarize Page
workflow:
  requires: [fetch]
chat:
  model:
    name: llama3.2:1b
    timeout: 60s
  context:
    role: user
    prompt: |
      Summarize the following web page content in 3-5 sentences.

      URL: {{ get('url') }}
      Content:
      {{ output('fetch').content }}
  harness:
    output:
      json: true
      keys:
        - summary
