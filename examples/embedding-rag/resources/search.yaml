actionId: searchDocs
name: Search Documents
validations:
  methods: [POST]
  routes: [/search]
  check:
    - get('query') != ''
  error:
    code: 400
    message: "query is required"
component:
  name: embedding
  with:
    operation: search
    text: "{{ get('query') }}"
    collection: "{{ get('collection', 'docs') }}"
    limit: 5
