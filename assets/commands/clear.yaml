version: 2.0.0
# kdeps update installs these with this command: what its run steps use
requires:
  tools/session_ops: ""
name: clear
order: 30
usage:
  - args: ""
    help: Clear the conversation history
run:
  - tool: session_ops
    args:
      operation: clear
      summarize_min_turns: 4  # a session this long is summarized before it is cleared
    # print: a template over the tool's JSON result (.turns, .summary)
    print: |-
      {{if .summary}}**Branch summary:**

      {{.summary}}

      {{end}}Conversation history cleared.
