apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: wikipedia
  description: Look up a Wikipedia topic through the kdeps API
  version: "1.0.1"
interface:
  inputs:
    - name: query
      type: string
      required: true
      description: Topic to look up
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Lookup
    httpClient:
      method: POST
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/wikipedia/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        query: "{{ get('wikipedia.query') }}"
