apiVersion: kdeps.io/v1
kind: Workflow

metadata:
  name: sql-advanced
  description: Advanced SQL operations with batch processing and multiple formats
  version: "1.0.0"
  targetActionId: results

settings:

  apiServer:
    portNum: 16395
    routes:
      - path: /api/v1/sql-demo
        methods: [GET, POST]
    cors:
      allowOrigins:
        - "*"

  agentSettings:
    timezone: Etc/UTC
    pythonVersion: "3.12"
  # Connection strings for `analytics` and `inventory` live in
  # ~/.kdeps/config.yaml sql_connections (see README), never in the workflow.
