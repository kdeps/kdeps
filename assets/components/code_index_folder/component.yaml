apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: code_index_folder
  description: Index the working directory through the kdeps API
  version: "1.0.0"
interface:
  inputs: []
  # body is the handler text. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Index the working directory
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/code_index_folder/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data: {}
