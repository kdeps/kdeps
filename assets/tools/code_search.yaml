version: 1.1.0
description: 'Search for a symbol or pattern across the codebase. Use this first to locate symbols before using code_definition or code_references. Requires: query, path. Optional: pattern, language, languageId, context, limit.'
parameters:
  path:
    type: string
    description: File or directory to search (absolute path)
    required: true
  query:
    type: string
    description: Symbol name or search pattern
    required: true
  pattern:
    type: string
    description: File glob filter, for example "*.go" (ripgrep fallback only)
  language:
    type: string
    description: ripgrep --type value, for example go (ripgrep fallback only)
  languageId:
    type: string
    description: Explicit LSP language ID (go, python, rust, typescript, javascript, c, cpp, ruby, java). Auto-detected from the path extension if omitted
  context:
    type: number
    description: Lines of context before and after each match (ripgrep fallback only)
  limit:
    type: number
    description: Maximum results per file (ripgrep fallback only). 0 = unlimited
