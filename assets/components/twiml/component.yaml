apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: twiml
  description: Build a TwiML voice response (say, play, pause, gather, dial, record, hangup, reject, redirect) for a phone webhook
  version: "1.1.0"
interface:
  inputs:
    - name: verbs
      type: array
      required: true
      description: "TwiML verbs in order, one key each, e.g. [{say: Hello}, {gather: {input: dtmf, numDigits: 1, action: /voice/menu, say: Press 1}}, {hangup: true}]"
  output:
    twiml: "{{ fromJSON(output('call').body).twiml }}"
resources:
  # One call to the kdeps API's twiml tool: the component holds no XML builder
  # of its own.
  - actionId: call
    name: TwiML
    httpClient:
      method: POST
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/twiml/call
      headers:
        Content-Type: application/json
      timeout: 30s
      failOnError: true
      data:
        verbs: "{{ json(get('twiml.verbs')) }}"
