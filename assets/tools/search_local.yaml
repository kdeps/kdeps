version: 1.3.0
aliases: [grep, rg, ripgrep, search_files, find_in_files, codebase_search, grep_search]  # other names a model may call it by; the model is shown only this tool's name
description: 'Search for text patterns in local files using ripgrep. Returns matching files with a snippet, and (when the query is found) a match_id/line/revision - pass match_id to read_file to jump straight to that hit. Use for finding usages, patterns, or strings across the codebase. Requires: query (search term). path is the directory to search; leave it out to search every folder of the working project (its own and the search folders its card lists). Optional: glob (file pattern), limit (max results, default 3), index (rank results with the folder index); index also accepts fuzzy, maxDistance, indexDBPath and graphBoost.'
parameters:
  fuzzy:
    type: boolean
    description: Fuzzy (Levenshtein) matching when index is true
  glob:
    type: string
    description: File glob filter, e.g. '*.go', '*.py'
  graphBoost:
    type: boolean
    description: Re-rank indexed results using the folder's reference/topic graph; requires index
  index:
    type: boolean
    description: Build and use the folder's TF-IDF index for ranked search instead of a content walk
  indexDBPath:
    type: string
    description: Index database path; defaults to the folder's kdeps data dir
  limit:
    type: number
    description: 'Maximum number of results. Default: 3'
  maxDistance:
    type: number
    description: 'Maximum edit distance for fuzzy matching. Default: 2'
  path:
    type: string
    description: Directory to search in (absolute path); omit to search all of the project's folders
  query:
    type: string
    description: Search term or regex pattern
    required: true
