version: 1.0.0
description: 'Read the Notion API: GET https://api.notion.com/v1/PATH and return the JSON. Use it for pages, page properties, blocks and users. Requires NOTION_TOKEN, NOTION_API_KEY or the vault secret notion_token.'
parameters:
  path:
    type: string
    description: 'The API path after https://api.notion.com/v1/, with its query string. Examples: pages/PAGE_ID, blocks/BLOCK_ID/children?page_size=50, users/me.'
    required: true
http:
  env:
    TOKEN: [NOTION_TOKEN, NOTION_API_KEY, "secret:notion_token"]
  method: GET
  # The host is fixed; path only adds to it.
  url: 'https://api.notion.com/v1/{{trimPrefix .args.path "/"}}'
  headers:
    Authorization: 'Bearer {{.env.TOKEN}}'
    Notion-Version: '2022-06-28'
    User-Agent: kdeps
