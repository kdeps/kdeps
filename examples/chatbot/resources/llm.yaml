actionId: llmResource
name: LLM Chat

guardrails:
  methods: [POST]
  routes: [/api/v1/chat]

  check:
    - get('q') != ''
  error:
    code: 400
    message: Query parameter 'q' is required

chat:
  model:
    name: llama3.2:1b
    timeout: 60s
  context:
    role: user
    prompt: "{{ get('q') }}"
    scenario:
      - role: assistant
        prompt: You are a helpful AI assistant.
  harness:
    output:
      json: true
      keys:
        - answer
