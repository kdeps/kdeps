# OpenAI-compatible LLM provider: kdeps registers a chat backend named after
# this file and reads its key from llm.ernie_api_key in ~/.kdeps/config.yaml.
version: 1.0.0
name: ernie
label: Ernie
order: 150                # position in provider lists and the setup prompt
configKey: ernie_api_key
envVar: ERNIE_API_KEY
url: https://aip.baidubce.com/rpc/2.0/ai_custom/v1/wenxinworkshop/chat
chatPath: /ernie-bot
hosts: [baidubce.com]
