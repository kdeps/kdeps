apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: task_complete
  description: Complete a task through the kdeps API
  version: "1.0.1"
interface:
  inputs:
    - name: task_id
      type: string
      required: true
      description: Task id to complete
  # body is the completed-task sentence. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Complete task
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/task_complete/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        task_id: "{{ get('task_complete.task_id') }}"
