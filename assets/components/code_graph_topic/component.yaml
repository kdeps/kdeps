apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: code_graph_topic
  description: Graph indexed files for a topic through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: topic
      type: string
      required: true
      description: Topic declared in frontmatter
  # body is the handler text. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Graph indexed files for a topic
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/code_graph_topic/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        topic: "{{ get('code_graph_topic.topic') }}"
