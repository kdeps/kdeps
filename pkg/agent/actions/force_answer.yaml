name: force_answer
# kind names the trigger shape this action is meant for. Valid values:
#   tokens         a token-count measurement (events' "tokens"/"ctxWindowFraction"/"tokensSinceCheckpoint")
#   bytes          a byte-length measurement (events' "bytes")
#   distinctCalls  a distinct-call-count measurement (events' "distinctCalls")
#   items          a bare count with no trigger condition (events' "items")
#   rounds         a round/repeat-count measurement (events' "rounds")
kind: rounds
description: >-
  End the current tool-calling loop and force a final text answer from
  whatever was gathered, instead of letting the model keep spinning.
