version: 1.1.0
description: Retrieve semantically relevant text chunks from the configured RAG index. Use for finding code, documentation, or notes related to a query before implementing or answering. Requires KDEPS_RAG_BASE_URL pointing to a compatible RAG service.
parameters:
  query:
    type: string
    description: The search query to find relevant context for
    required: true
  top_k:
    type: number
    description: 'Number of results to return (default: 5, max: 32)'
    default: 5
http:
  env:
    BASE_URL: [KDEPS_RAG_BASE_URL]
  method: POST
  url: '{{trimSuffix .env.BASE_URL "/"}}/v1/query'
  headers:
    Content-Type: application/json
  body: '{"query": {{json .args.query}}, "top_k": {{min .args.top_k 32}}}'
  result: |-
    {{range $i, $r := .response.results}}{{if $i}}---
    {{end}}[{{add $i 1}}] score={{printf "%.3f" $r.score}} source={{$r.source}}
    {{$r.text}}
    {{end}}
