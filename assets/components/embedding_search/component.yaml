apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: embedding_search
  description: Search the local embedding database through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: query
      type: string
      required: true
      description: Natural language search query
    - name: collection
      type: string
      required: true
      description: Document collection to search
  # body is the handler text. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Search embeddings
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/embedding_search/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        query: "{{ get('embedding_search.query') }}"
        collection: "{{ get('embedding_search.collection') }}"
