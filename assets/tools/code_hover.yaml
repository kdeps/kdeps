version: 1.1.0
description: 'Get documentation and type info for a symbol. Returns doc comments and type signatures. Requires: symbol, path. Optional: languageId.'
parameters:
  path:
    type: string
    description: File containing the symbol (absolute path)
    required: true
  symbol:
    type: string
    description: Symbol name to get documentation for
    required: true
  languageId:
    type: string
    description: Explicit LSP language ID (go, python, rust, typescript, javascript, c, cpp, ruby, java). Auto-detected from the path extension if omitted
