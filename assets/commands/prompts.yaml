version: 2.0.0
# kdeps update installs these with this command: what its run steps use
requires:
  tools/session_ops: ""
name: prompts
order: 60
usage:
  - args: ""
    help: List loaded prompt templates
run:
  - tool: session_ops
    args: {operation: prompts}
    print: |-
      {{if not .prompts}}No prompt templates loaded.{{else}}**Loaded prompt templates:**
      {{range .prompts}}
      - `/{{.name}}{{if .hint}} <{{.hint}}>{{end}}` {{.description}}{{end}}{{end}}
