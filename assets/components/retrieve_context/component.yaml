apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: retrieve_context
  description: Retrieve relevant chunks from the RAG index through the kdeps API
  version: "1.0.1"
interface:
  inputs:
    - name: query
      type: string
      required: true
      description: The search query to find relevant context for
    - name: top_k
      type: number
      default: 5
      description: Number of results to return (max 32)
  # body is the scored chunk list. A missing KDEPS_RAG_BASE_URL is an error. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Retrieve
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/retrieve_context/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 60s
      data:
        query: "{{ get('retrieve_context.query') }}"
        top_k: "{{ get('retrieve_context.top_k') }}"
