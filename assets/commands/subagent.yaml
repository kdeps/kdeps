version: 1.3.0
name: subagent
order: 221
usage:
  - args: "[current|free|<model>]"
    help: Show or set the model for subagent calls (knowledge extraction, refine, judges)
# setting: the command shows or sets one session setting; the text is here.
setting:
  key: subagent           # live session state; the choice persists across sessions
  values: [current, free]  # any other model id is also accepted
  show: >-
    {{if eq .value "free"}}subagent calls use a large OpenRouter free model, chosen at random for each call{{else if eq .value "current"}}subagent calls use the session model{{if .model}} ({{.model}}){{end}}{{else}}subagent calls use {{.value}}{{end}}
  set: >-
    {{if eq .value "free"}}subagent channel set to a large OpenRouter free model, chosen at random for each call{{else if eq .value "current"}}subagent channel set to the session model{{else}}subagent channel set to {{.value}}{{end}}
  invalid: "Usage: /subagent [current|free|<model>]"
