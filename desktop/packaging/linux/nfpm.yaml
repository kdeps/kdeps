# nfpm config for the kdeps desktop .deb / .rpm / Arch package.
# Run from dist/desktop with VERSION set: nfpm package -f nfpm.yaml -p deb
name: kdeps-desktop
arch: amd64
platform: linux
version: ${VERSION}
section: devel
priority: optional
maintainer: Joel Bryan Juliano <joelbryan.juliano@gmail.com>
description: Chat client for the kdeps agent loop (standalone, no kdeps CLI needed).
vendor: Kdeps
homepage: https://kdeps.com/
license: Apache-2.0
contents:
  - src: kdeps-desktop
    dst: /usr/bin/kdeps-desktop
    file_info:
      mode: 0755
  - src: kdeps-desktop.desktop
    dst: /usr/share/applications/kdeps-desktop.desktop
  - src: kdeps.png
    dst: /usr/share/icons/hicolor/512x512/apps/kdeps.png
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1
