apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: cohere_rerank
  description: Rerank documents by relevance to a query through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: documents
      type: string
      required: true
      description: 'JSON array of document texts to rerank, e.g. ["doc1", "doc2"]'
    - name: model
      type: string
      default: rerank-v3.5
      description: Cohere rerank model
    - name: query
      type: string
      required: true
      description: The search query to rank documents against
    - name: top_n
      type: number
      default: 5
      description: Number of top results to return
  # body is the ranked JSON array. A missing COHERE_API_KEY is an error. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Rerank
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/cohere_rerank/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 60s
      data:
        documents: "{{ get('cohere_rerank.documents') }}"
        model: "{{ get('cohere_rerank.model') }}"
        query: "{{ get('cohere_rerank.query') }}"
        top_n: "{{ get('cohere_rerank.top_n') }}"
