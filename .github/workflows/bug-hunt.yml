name: Bug Hunt

# kdeps runs /auto-improve against this repo on an OpenRouter free model and
# reports what the instrument log shows. Each evaluate reply is filed as a
# GitHub issue as soon as it arrives, unless an open issue has the same title.
# The hunt never edits code and never opens a pull request.
#
# gh uses RELEASE_TOKEN to file issues.
#
# OPENROUTER_API_KEY is the OpenRouter key. The model id comes from
# assets/models/openrouter.yaml. run shuffles that list. Each hunt is one
# task in its own process and instrument session. A hunt that does not
# finish tries another id. If the process dies before the issue URL, the
# script files it.

on:
  schedule:
    # After the 06:15 UTC OpenRouter harvest, so the catalog is current.
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bug-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build kdeps
        run: make build

      - name: Hunt and file issues
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: bash scripts/bug-hunt.sh run
