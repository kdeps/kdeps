apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: whatsapp_post
  description: Write to the WhatsApp Cloud API through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: path
      type: string
      required: true
      description: 'The Graph API path with its version (v23.0/PHONE_NUMBER_ID/messages)'
    - name: body
      type: object
      required: true
      description: 'The JSON request body, for example {"messaging_product": "whatsapp", "to": "...", "type": "text", "text": {"body": "..."}}'
  # The WhatsApp reply, parsed from JSON. A missing token is an error that names its sources.
  output: "{{ fromJSON(output('call').body) }}"
resources:
  - actionId: call
    name: WhatsApp POST
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/whatsapp_post/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 60s
      data:
        path: "{{ get('whatsapp_post.path') }}"
        body: "{{ get('whatsapp_post.body') }}"
