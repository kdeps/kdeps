apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: memory_save
  description: Save a fact through the kdeps API
  version: "1.0.1"
interface:
  inputs:
    - name: key
      type: string
      required: true
      description: Short key for the fact
    - name: value
      type: string
      required: true
      description: Fact to store
  # body is the saved-entry sentence. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Save memory
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/memory_save/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        key: "{{ get('memory_save.key') }}"
        value: "{{ get('memory_save.value') }}"
