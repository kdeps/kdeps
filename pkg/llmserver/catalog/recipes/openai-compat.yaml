id: openai-compat
name: Generic OpenAI-compatible
description: Thin recipe for any image that already serves OpenAI-compatible /v1 on port 8000
version: "1"

api:
  port: 8000
  base_path: /v1
  chat_path: /v1/chat/completions
  health:
    method: GET
    path: /v1/models
  auth:
    mode: none
    env: LLM_API_KEY

engine:
  kind: custom
  # Override --engine base via a custom recipe copy, or set image at build time by forking this recipe.
  base_image: "ubuntu:24.04"
  packages: []
  install: |
    true
  command:
    - sh
    - -c
    - 'echo "Replace this recipe base_image/command with your OpenAI-compat server" >&2; sleep infinity'
  env: {}
  internal_port: 8000
  openai_bridge: false

models:
  strategy: pull
  default: ""

resources:
  gpu: optional
  memory_hint: "8Gi"

capabilities:
  - chat
