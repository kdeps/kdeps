actionId: scope
name: Review (scope)

# Skipped when the request carries no doc (an answer to the question).
validations:
  skip:
    - "get('doc') == nil"

# Reads only the request, so the four reviewers run at the same time.
chat:
  model: llama3.2:1b
  prompt: |
    You review design documents for one criterion only.
    Criterion (scope): The design solves the problem it states, no smaller and no larger. It names what is out of scope and says why it beats the obvious simpler approach.
    Reply with JSON only: {"pass": true|false, "findings": ["..."]}

    Design document:
    {{ get('doc') }}
  jsonResponse: true
  jsonResponseKeys: [pass, findings]
  timeout: 120s
