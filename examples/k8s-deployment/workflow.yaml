apiVersion: kdeps.io/v1
kind: Workflow
metadata:
  name: k8s-example
  description: "A workflow demonstrating Kubernetes-specific settings like replicas and resource limits."
  version: 1.0.0
  targetActionId: main

settings:
  apiServer:
    portNum: 16395
    routes:
      - path: /api/v1/ask
        methods: [POST]
  agentSettings:
    # Kubernetes-specific settings
    replicas: 3
    resources:
      cpuLimit: "1000m"
      memoryLimit: "1Gi"
      cpuRequest: "500m"
      memoryRequest: "512Mi"
    
    # Environment variables will be mapped to K8s container env
    env:
      APP_MODE: production
      DATABASE_URL: "postgres://user:pass@db-service:5432/mydb"

resources:
  - actionId: main
    name: Deployment assistant
    chat:
      model: llama3.2:1b
      system: "You are a Kubernetes deployment assistant."
      prompt: "{{ get('q') }}"
    apiResponse:
      success: true
      response:
        answer: "{{ get('main') }}"
