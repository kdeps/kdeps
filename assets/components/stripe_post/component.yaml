apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: stripe_post
  description: Write to the Stripe API through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: path
      type: string
      required: true
      description: 'The API path after https://api.stripe.com/v1/. Examples: customers, refunds, invoices/INVOICE_ID/finalize.'
    - name: body
      type: object
      required: true
      description: 'The request fields as an object; kdeps sends them as form fields. Example: {"email": "a@b.c", "metadata": {"plan": "pro"}}.'
  # The Stripe reply, parsed from JSON. A missing token is an error that names its sources.
  output: "{{ fromJSON(output('call').body) }}"
resources:
  - actionId: call
    name: Stripe POST
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/stripe_post/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 60s
      data:
        path: "{{ get('stripe_post.path') }}"
        body: "{{ get('stripe_post.body') }}"
