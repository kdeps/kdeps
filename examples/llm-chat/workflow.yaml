apiVersion: kdeps.io/v1
kind: Workflow

metadata:
  name: llm-chat
  description: Interactive LLM chat - stdin REPL mode
  version: "1.0.0"
  targetActionId: chat

deploy:
  # interactive: kdeps run opens a prompt; each line runs the workflow.
  input:
    sources: [interactive]
  runtime:
    timezone: Etc/UTC
    pythonVersion: "3.12"
repl:
  prompt: "You: "
  sessionId: "llm-chat-session"


