apiVersion: kdeps.io/v1
kind: Workflow

metadata:
  name: telegram-bot
  description: Telegram bot that answers messages using a local LLM (Ollama)
  version: "1.0.0"
  targetActionId: reply

settings:
  agentSettings:
    timezone: Etc/UTC

  input:
    sources: [bot]
    bot:
      executionType: polling
      telegram:
        pollIntervalSeconds: 1  # credentials go in ~/.kdeps/config.yaml bot_connections.telegram
