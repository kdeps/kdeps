id: sglang
name: SGLang
description: SGLang OpenAI-compatible serving runtime (GPU)
version: "1"

api:
  port: 8000
  base_path: /v1
  chat_path: /v1/chat/completions
  health:
    method: GET
    path: /v1/models
  auth:
    mode: none
    env: LLM_API_KEY

engine:
  kind: sglang
  base_image: "lmsysorg/sglang:latest"
  packages: []
  install: |
    true
  command:
    - sh
    - -c
    - exec python3 -m sglang.launch_server --host 0.0.0.0 --port 8000 --model-path "${LLM_MODEL}"
  env: {}
  internal_port: 8000
  openai_bridge: false

models:
  strategy: pull
  default: ""

resources:
  gpu: required
  memory_hint: "16Gi"

capabilities:
  - chat
  - tools
