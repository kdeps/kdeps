actionId: search
name: Search
validations:
  methods: [POST]
  routes: [/search]
  check:
    - get('query') != ''
  error:
    code: 400
    message: "query is required"
# The search_local component POSTs to the kdeps API's search_local tool.
component:
  name: search_local
  with:
    path: "{{ get('path', '/data') }}"
    query: "{{ get('query') }}"
    glob: "{{ get('glob', '') }}"
    limit: 20
