apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: embedding_vectorize
  description: Convert text into embeddings through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: texts
      type: array
      description: Strings to embed. An empty list is refused
  # body is the handler text. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Vectorize text
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/embedding_vectorize/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        texts: "{{ get('embedding_vectorize.texts') }}"
