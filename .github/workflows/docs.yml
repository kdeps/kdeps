name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/v1/**'
      - 'docs/v2/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            docs/v1/package-lock.json
            docs/v2/package-lock.json

      - name: Install d2
        run: |
          curl -fsSL -o /tmp/d2.tar.gz https://github.com/terrastruct/d2/releases/download/v0.7.1/d2-v0.7.1-linux-amd64.tar.gz
          echo "eb172adf59f38d1e5a70ab177591356754ffaf9bebb84e0ca8b767dfb421dad7  /tmp/d2.tar.gz" | sha256sum -c
          tar -xzf /tmp/d2.tar.gz -C /tmp
          sudo install /tmp/d2-v0.7.1/bin/d2 /usr/local/bin/d2
          d2 --version

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies (v1)
        run: npm ci
        working-directory: docs/v1

      - name: Build v1
        run: npm run build
        working-directory: docs/v1

      - name: Install dependencies (v2)
        run: npm ci
        working-directory: docs/v2

      - name: Build v2
        run: npm run build
        working-directory: docs/v2

      - name: Nest v1 under v2
        run: |
          mkdir -p docs/v2/.vitepress/dist/v1
          cp -rp docs/v1/.vitepress/dist/. docs/v2/.vitepress/dist/v1/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/v2/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
