version: 2.0.0
# kdeps update installs these with this command: what its run steps use
requires:
  tools/session_ops: ""
name: reload
order: 170
usage:
  - args: ""
    help: "Reload skills, prompt templates, and instructions from disk"
run:
  - tool: session_ops
    args: {operation: reload}
    print: "Reloaded skills ({{.skills}}) and prompt templates ({{.prompts}}) from disk."
