version: 1.2.0
category: memory
description: 'Set a card''s status and/or next step and stamp its updated date. This is the only place status and the next step are written: never put them in a note. Without a name, updates the working directory''s project card (created on first use). Status archived moves the project folder to archive/. add_search_folder links a folder outside the project (docs, a shared library) so recall and search_local cover it too, and indexes it.'
parameters:
  name:
    type: string
    description: Card name; omit for the working directory's card
  status:
    type: string
    description: 'New status, e.g. active, paused, done, archived'
  next:
    type: string
    description: The one next step
  add_search_folder:
    type: string
    description: A folder outside the project to search with it (full path); it is indexed
  remove_search_folder:
    type: string
    description: A search folder to stop searching with the project
