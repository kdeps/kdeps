version: 1.0.0
description: 'Read the Airtable API: GET https://api.airtable.com/v0/PATH and return the JSON. Use it to list and read records and bases. Requires AIRTABLE_TOKEN, AIRTABLE_API_KEY or the vault secret airtable_token.'
parameters:
  path:
    type: string
    description: 'The API path after https://api.airtable.com/v0/, with its query string. Examples: BASE_ID/TABLE?maxRecords=20, BASE_ID/TABLE/RECORD_ID, meta/bases.'
    required: true
http:
  env:
    TOKEN: [AIRTABLE_TOKEN, AIRTABLE_API_KEY, "secret:airtable_token"]
  method: GET
  # The host is fixed; path only adds to it.
  url: 'https://api.airtable.com/v0/{{trimPrefix .args.path "/"}}'
  headers:
    Authorization: 'Bearer {{.env.TOKEN}}'
    User-Agent: kdeps
