version: 1.1.0
name: tools-reminder
kind: standalone
body: |-
  Reminder: act only through the fenced kdeps tools (bash_exec, the file tools, etc.), never a built-in sandbox or code interpreter. {{if .TextTools}}kdeps is a parser and an interpreter: it parses a matched <invoke> block out of your message at runtime and interprets it. Not your code interpreter. That block is a LITERAL invoke block: the characters <invoke> and </invoke> written as literal text.{{else}}Use your native tool-call channel. Do not write an <invoke> block.{{end}}
