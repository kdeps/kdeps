apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: search_local
  description: Search local files through the kdeps API
  version: "1.2.0"
interface:
  inputs:
    - name: query
      type: string
      description: Search term. A query or a glob is required
    - name: path
      type: string
      description: Directory to search. Empty searches the working directory
    - name: glob
      type: string
      description: File glob filter, for example *.go
    - name: limit
      type: number
      default: 3
      description: Maximum number of results
    - name: index
      type: boolean
      description: Build and use the folder's TF-IDF index for ranked search
    - name: fuzzy
      type: boolean
      description: Fuzzy (Levenshtein) matching when index is true
    - name: maxDistance
      type: integer
      description: Maximum edit distance for fuzzy matching (default 2)
    - name: indexDBPath
      type: string
      description: Index database path; defaults to the folder's kdeps data dir
    - name: graphBoost
      type: boolean
      description: Re-rank indexed results using the folder's reference/topic graph; requires index
  # fromJSON returns the result map (results, count) rather than JSON text.
  output: "{{ fromJSON(output('call').body) }}"
resources:
  - actionId: call
    name: Search local files
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/search_local/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        query: "{{ get('search_local.query') }}"
        path: "{{ get('search_local.path') }}"
        glob: "{{ get('search_local.glob') }}"
        limit: "{{ get('search_local.limit') }}"
        index: "{{ get('search_local.index') }}"
        fuzzy: "{{ get('search_local.fuzzy') }}"
        maxDistance: "{{ get('search_local.maxDistance') }}"
        indexDBPath: "{{ get('search_local.indexDBPath') }}"
        graphBoost: "{{ get('search_local.graphBoost') }}"
