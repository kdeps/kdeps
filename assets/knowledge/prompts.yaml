version: 1.0.0
# What the model reads about the knowledge vault, in both modes: the vault's
# description at the start of a session, the notes recall found for a request,
# and the files the project's search indexes matched. Go templates.

# .Root (the vault), .Layout (vault.yaml): sent once, at the start of an agent session
vault: |-
  <knowledge-vault>
  The knowledge vault is {{.Root}}; each project has one folder in {{.Layout.Folders.Projects}}/ (card <name>.md, {{.Layout.Project.Sessions}}/, {{.Layout.Project.Memory}}/, {{.Layout.Project.Decisions}}/, {{.Layout.Project.Notes}}/), knowledge across projects is in {{.Layout.Folders.Shared}}/. Each turn includes the cards' current status and may include a <knowledge-recall> list of the notes related to the request: read only those you need. Status lives in cards (knowledge_card_get/update), the story in notes (knowledge_note_save for a new idea). A <knowledge-files> list names files from the project's search index (built by /search index; the card's index rows give its path): open them with read_file, or search the project further with search_local, path set to the project's folder.
  </knowledge-vault>

# .Hits, each .Path (absolute), .Summary, .Chain (the relation path), .Via (the seed it came from)
recall: |-
  <knowledge-recall>
  Notes in the knowledge vault related to this request, from its link graph (best first). Read only the ones you need with read_file; status lives in the project card, the story in these notes.
  {{range .Hits}}- {{.Path}}{{if .Summary}} - {{.Summary}}{{end}}{{if .Chain}} ({{.Chain}}){{else if .Via}} (linked from {{.Via}}){{end}}
  {{end}}</knowledge-recall>

# .Body: the matched folders and files, each folder's lines starting on a new line
files: |-
  <knowledge-files>
  Files in this project's search index that match the request (best first). Open the ones you need with read_file; search further with search_local, path set to the folder (or no path to search all of the project's folders).{{.Body}}
  </knowledge-files>
