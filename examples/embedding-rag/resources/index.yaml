actionId: indexDoc
name: Index Document
guardrails:
  methods: [POST]
  routes: [/index]
  check:
    - get('text') != ''
  error:
    code: 400
    message: "text is required"
component:
  name: embedding
  with:
    operation: upsert
    text: "{{ get('text') }}"
    collection: "{{ get('collection', 'docs') }}"
