apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: task_append_output
  description: Append task output through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: task_id
      type: string
      required: true
      description: Task id to append to
    - name: text
      type: string
      required: true
      description: Text appended to the task output
  # body is the appended-output sentence. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Append output
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/task_append_output/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        task_id: "{{ get('task_append_output.task_id') }}"
        text: "{{ get('task_append_output.text') }}"
