# OpenAI-compatible LLM provider: kdeps registers a chat backend named after
# this file and reads its key from llm.deepseek_api_key in ~/.kdeps/config.yaml.
version: 1.0.0
name: deepseek
label: DeepSeek
order: 90                # position in provider lists and the setup prompt
configKey: deepseek_api_key
envVar: DEEPSEEK_API_KEY
defaultModel: deepseek-v4-flash
url: https://api.deepseek.com
chatPath: /v1/chat/completions
embeddings: true          # also serves OpenAI-compatible /embeddings
hosts: [deepseek.com]
