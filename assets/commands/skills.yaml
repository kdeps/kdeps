version: 2.0.0
# kdeps update installs these with this command: what its run steps use
requires:
  tools/session_ops: ""
name: skills
order: 50
usage:
  - args: ""
    help: List loaded skills
run:
  - tool: session_ops
    args: {operation: skills}
    print: |-
      {{if not .skills}}No skills loaded.{{else}}**Loaded skills:**
      {{range .skills}}
      - `/{{.name}}` {{.description}}{{end}}{{end}}
