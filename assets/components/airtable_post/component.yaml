apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: airtable_post
  description: Write to the Airtable API through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: path
      type: string
      required: true
      description: 'The API path after https://api.airtable.com/v0/. Example: BASE_ID/TABLE.'
    - name: body
      type: object
      required: true
      description: 'The JSON request body. Example: {"records": [{"fields": {"Name": "..."}}]}.'
  # The Airtable reply, parsed from JSON. A missing token is an error that names its sources.
  output: "{{ fromJSON(output('call').body) }}"
resources:
  - actionId: call
    name: Airtable POST
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/airtable_post/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 60s
      data:
        path: "{{ get('airtable_post.path') }}"
        body: "{{ get('airtable_post.body') }}"
