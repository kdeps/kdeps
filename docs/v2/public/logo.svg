<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="kGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00B8D4"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#0D1117" stroke="#21262D" stroke-width="2"/>
  <!-- Glowing 'k' -->
  <text x="60" y="94" font-family="'SF Mono','JetBrains Mono','Fira Code',monospace" font-size="96" font-weight="700" fill="url(#kGlow)" text-anchor="middle">k</text>
  <!-- Subtle ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#kGlow)" stroke-width="1" opacity="0.3"/>
</svg>
