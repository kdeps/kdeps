# OpenAI-compatible LLM provider: kdeps registers a chat backend named after
# this file and reads its key from llm.together_api_key in ~/.kdeps/config.yaml.
version: 1.0.0
name: together
label: Together
order: 60                # position in provider lists and the setup prompt
configKey: together_api_key
envVar: TOGETHER_API_KEY
defaultModel: meta-llama/Llama-3-70b-chat-hf
url: https://api.together.xyz
chatPath: /v1/chat/completions
embeddings: true          # also serves OpenAI-compatible /embeddings
hosts: [together.xyz]
