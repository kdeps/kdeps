name: Build and Test

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# security-scan, docker-scan, lint, test and test-windows are required status
# checks on main. A skipped required job counts as passing, but a workflow that
# never triggers leaves the check "expected" and blocks the PR forever. So the
# workflow always runs; the `changes` job decides whether the real jobs execute.
jobs:
  # Decides whether the code jobs below run. `code=true` when the PR (or push)
  # changed at least one file that is not docs, not markdown and not the
  # coverage badge. Dependency-free so there is no third-party action in the
  # critical path of a required check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi
          # First push of a new branch: no diff base, assume code changed.
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$base" "$head")"
          echo "Changed files:"; echo "$changed"
          if [ -z "$changed" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|.*\.md$|\.github/coverage-badge\.json$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  security-scan:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: .trivyignore
          skip-dirs: docs/v2/node_modules,kdeps-io,kdeps-io.bak,private,.git
          skip-files: coverage.out,coverage-integration.out

  docker-scan:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build kdeps binary
        run: make build
      - name: Build sample Docker image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./kdeps bundle build examples/webserver-static --tag kdeps-ci-scan:local
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: kdeps-ci-scan:local
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: .trivyignore

  lint:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          VERSION="$(cat .golangci-lint-version)"
          BIN_DIR="$(go env GOPATH)/bin"
          for attempt in 1 2 3 4 5; do
            if curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${VERSION}/install.sh" | sh -s -- -b "$BIN_DIR" "$VERSION"; then
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              golangci-lint version
              exit 0
            fi
            echo "golangci-lint install attempt $attempt failed; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          exit 1
      - name: golangci-lint
        run: golangci-lint run --timeout=10m --config=.golangci.yml ./cmd/... ./pkg/... ./tests/...
      - name: govulncheck
        run: |
          set +e
          go tool govulncheck ./... > /tmp/govuln.txt 2>&1
          exit_code=$?
          set -e
          cat /tmp/govuln.txt
          if [ $exit_code -ne 0 ]; then
            # GO-2026-4887, GO-2026-4883: docker/docker daemon-side plugin-authz vulns, no fix available (v28.5.2 is latest)
            new_vulns=$(grep "^Vulnerability #" /tmp/govuln.txt | grep -v "GO-2026-4887\|GO-2026-4883" || true)
            if [ -n "$new_vulns" ]; then exit 1; fi
          fi

  test:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      UV_NO_CACHE: 1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: 'go.mod'

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/0.11.20/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

    # Free/open-source tooling several e2e Tier-4 component tests need
    # (scraper, calendar, pdf, tts, browser) -- without these installed the
    # tests correctly self-skip rather than fail, but installing them lets
    # that real coverage run instead of being skipped.
    - name: Install Python e2e test deps
      run: python3 -m pip install --quiet pyyaml requests beautifulsoup4 icalendar pdfkit playwright

    - name: Install Playwright Chromium
      run: playwright install --with-deps chromium

    - name: Install OS packages for e2e (wkhtmltopdf, espeak, tesseract, imagemagick)
      run: sudo apt-get update && sudo apt-get install -y wkhtmltopdf espeak tesseract-ocr imagemagick

    # whisper.cpp has no apt package on Ubuntu noble (confirmed live: "E: Unable
    # to locate package whisper-cpp") -- build the whisper-cli binary from
    # source instead, matching upstream's own recommended install method.
    # Cached by commit-independent key so this only rebuilds when explicitly
    # bumped, not on every run (~1-2 min cold build).
    - name: Cache whisper-cli binary
      id: cache-whisper-cli
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/bin/whisper-cli
        key: whisper-cli-v1.7.5-static

    - name: Build whisper-cli from source
      if: steps.cache-whisper-cli.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch v1.7.5 https://github.com/ggerganov/whisper.cpp.git /tmp/whisper.cpp
        # Static build: a shared libwhisper.so.1 only exists in this ephemeral
        # build dir, so a cache-hit run restoring just the binary would fail
        # with "cannot open shared object file" (confirmed live in CI) unless
        # everything is linked in statically.
        cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
        cmake --build /tmp/whisper.cpp/build -j"$(nproc)" --target whisper-cli
        mkdir -p ~/.local/bin
        install -m 0755 /tmp/whisper.cpp/build/bin/whisper-cli ~/.local/bin/whisper-cli

    - name: Add whisper-cli to PATH
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # repo root's package.json already declares puppeteer as a devDependency
    # (used by the ChatGPT Clone example's e2e browser test); nothing
    # previously installed it on this job.
    - name: Install npm deps for browser e2e tests
      run: npm ci

    - name: Install ollama
      run: |
        curl -fsSL -o /tmp/ollama.tar.zst https://github.com/ollama/ollama/releases/download/v0.30.7/ollama-linux-amd64.tar.zst
        echo "88c110a6c9a9130e5ed0aa90f47e8ddb013cb638d834e11ddf1517615704d34c  /tmp/ollama.tar.zst" | sha256sum -c
        sudo tar --zstd -xf /tmp/ollama.tar.zst -C /usr/local
        ollama --version

    # We need golangci-lint installed because 'make test-unit' depends on 'lint'
    - name: Install golangci-lint
      run: |
        set -euo pipefail
        VERSION="$(cat .golangci-lint-version)"
        BIN_DIR="$(go env GOPATH)/bin"
        for attempt in 1 2 3 4 5; do
          if curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${VERSION}/install.sh" | sh -s -- -b "$BIN_DIR" "$VERSION"; then
            echo "$BIN_DIR" >> "$GITHUB_PATH"
            golangci-lint version
            exit 0
          fi
          echo "golangci-lint install attempt $attempt failed; retrying in $((attempt * 15))s..."
          sleep $((attempt * 15))
        done
        exit 1

    # Tests run against the committed llamafile registry
    # (pkg/executor/llm/llamafile_versions_data.go); the registry is refreshed
    # and committed by the nightly workflow, never harvested live here.
    - name: Cache llamafile models
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.kdeps/models
        key: llamafiles-${{ hashFiles('pkg/executor/llm/llamafile_versions_data.go') }}

    - name: Build
      run: make build

    - name: Start Ollama
      run: |
        ollama serve &
        sleep 5
        ollama pull tinydolphin

    - name: Test Unit
      run: make test-unit
      # make test-unit runs go test with -timeout=30m; the step must exceed that
      # so the Go timeout is the real guard and produces a goroutine dump on a
      # real hang instead of an opaque step kill (the previous 25m step killed
      # before Go could, hiding a bbolt flock deadlock in the storage layer).
      timeout-minutes: 35

    - name: Upload unit coverage artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-out
        path: coverage.out
        retention-days: 1

    - name: Test Integration
      run: make test-integration
      timeout-minutes: 15

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: kdeps/kdeps
        files: coverage.out,coverage-integration.out
        fail_ci_if_error: false

    # Populate the llamafile cache (no-op on cache hit) so the llamafile e2e
    # exercises the default file backend with a real model.
    - name: Pre-download default llamafile
      run: |
        mkdir -p ~/.kdeps/models
        FILE=~/.kdeps/models/Llama-3.2-1B-Instruct-Q4_K_M.llamafile
        if [ ! -f "$FILE" ]; then
          curl -fL --retry 3 -o "$FILE" \
            https://huggingface.co/mozilla-ai/Llama-3.2-1B-Instruct-llamafile/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.llamafile
        fi
        chmod +x "$FILE"

    # Same idea for the transcribe: whisper-cpp backend's default model --
    # shares the ~/.kdeps/models cache step above (path: ~/.kdeps/models),
    # so this is a no-op on cache hit.
    - name: Pre-download default whisper.cpp model
      run: |
        mkdir -p ~/.kdeps/models
        FILE=~/.kdeps/models/ggml-base.en.bin
        if [ ! -f "$FILE" ]; then
          curl -fL --retry 3 -o "$FILE" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
        fi

    - name: Test E2E
      run: make test-e2e
      timeout-minutes: 25
      env:
        KDEPS_E2E_LLAMAFILE_DOWNLOAD: "1"

  test-windows:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    # Proves the Windows release binary actually builds and its unit + integration
    # tests pass natively, not just that it cross-compiles. E2E is included too;
    # scripts needing ollama/python3/docker self-skip when the tool is missing
    # (see tests/e2e/*.sh `command -v` guards) rather than failing the job.
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # github.com/mattn/go-sqlite3 needs cgo; without a C compiler on PATH,
      # CGO_ENABLED auto-disables and go-sqlite3 falls back to a stub that
      # errors at runtime ("this is a stub") on every sqlite-backed test.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: Add MSYS2 mingw64 (gcc) to PATH
        # windows-latest ships MSYS2 at C:\msys64 but doesn't put it on PATH.
        shell: bash
        run: echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Install uv
        # kdeps's default (file/llamafile) backend shells out to uv to set up
        # its Python venv; without it on PATH, e2e's llamafile-e2e scenario
        # fails with "uv: executable file not found".
        shell: bash
        run: curl -LsSf https://astral.sh/uv/0.11.20/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python e2e test deps
        # e2e scripts' own tooling (not kdeps itself) parses workflow YAML and
        # exercises the scraper example; windows-latest's system python3 has
        # neither preinstalled, unlike ubuntu-latest's.
        shell: bash
        run: python3 -m pip install --quiet pyyaml requests beautifulsoup4

      - name: Build
        shell: bash
        run: go build ./...

      - name: Vet
        shell: bash
        run: go vet ./...

      - name: Test Unit
        shell: bash
        env:
          KDEPS_MEMORY_DB_PATH: ":memory:"
        # -p 1 serializes package builds/links. -parallel only limits test-level
        # parallelism within a binary, not `go test`'s own build parallelism
        # (default = NumCPU); linking several test binaries at once exceeded the
        # windows-latest runner's page-file commit limit ("VirtualAlloc ...
        # errno=1455 / fatal error: out of memory" in cmd/link).
        run: go test -p 1 -short -failfast -parallel 1 -count=1 -timeout=20m ./pkg/... ./cmd/... ./

      - name: Test Integration
        shell: bash
        env:
          KDEPS_MEMORY_DB_PATH: ":memory:"
        # Same -p 1 -parallel 1 constraint as the unit-test step above (linking
        # several test binaries at once exceeds the runner's page-file commit limit).
        run: go test -p 1 -parallel 1 -count=1 -timeout=20m ./tests/integration/...

      - name: Cache llamafile models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.kdeps/models
          key: llamafiles-windows-${{ hashFiles('pkg/executor/llm/llamafile_versions_data.go') }}

      - name: Build kdeps binary for e2e
        shell: bash
        run: go build -o kdeps .

      # Populate the llamafile cache (no-op on cache hit) so the llamafile e2e
      # scripts exercise the default file backend with a real model, mirroring
      # the Linux `test` job's step.
      - name: Pre-download default llamafile
        shell: bash
        run: |
          mkdir -p ~/.kdeps/models
          FILE=~/.kdeps/models/Llama-3.2-1B-Instruct-Q4_K_M.llamafile
          if [ ! -f "$FILE" ]; then
            curl -fL --retry 3 -o "$FILE" \
              https://huggingface.co/mozilla-ai/Llama-3.2-1B-Instruct-llamafile/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.llamafile
          fi
          chmod +x "$FILE"

      - name: Test E2E
        shell: bash
        timeout-minutes: 30
        env:
          KDEPS_E2E_LLAMAFILE_DOWNLOAD: "1"
          KDEPS_MEMORY_DB_PATH: ":memory:"
        run: bash tests/e2e/e2e.sh

  coverage-badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Uses RELEASE_TOKEN (admin PAT) instead of the default github-actions[bot]
      # token: main's branch protection requires 5 status checks, which the
      # bot's own follow-up commit can never satisfy (chicken-and-egg). Admins
      # are allowed to bypass (enforce_admins is off), so pushing as an admin
      # identity is what lets this land. Same pattern as nightly-release.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-out
      - name: Update coverage badge
        run: |
          COV=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')
          NUM=${COV%\%}
          if awk "BEGIN {exit !($NUM >= 100)}"; then COLOR=brightgreen
          elif awk "BEGIN {exit !($NUM >= 90)}"; then COLOR=green
          elif awk "BEGIN {exit !($NUM >= 80)}"; then COLOR=yellowgreen
          elif awk "BEGIN {exit !($NUM >= 70)}"; then COLOR=yellow
          else COLOR=orange
          fi
          printf '%s\n' "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COV}\",\"color\":\"${COLOR}\"}" > .github/coverage-badge.json
      - name: Commit coverage badge
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore: update coverage badge [skip ci]"
          file_pattern: .github/coverage-badge.json
