version: 1.1.0
description: 'Find all references to a symbol across the codebase. Returns every file and line. Requires: symbol, path. Optional: pattern, language, languageId, context, limit.'
parameters:
  path:
    type: string
    description: File containing one reference (absolute path)
    required: true
  symbol:
    type: string
    description: Symbol name to find references for
    required: true
  pattern:
    type: string
    description: File glob filter, for example "*.go" (ripgrep fallback only)
  language:
    type: string
    description: ripgrep --type value, for example go (ripgrep fallback only)
  languageId:
    type: string
    description: Explicit LSP language ID (go, python, rust, typescript, javascript, c, cpp, ruby, java). Auto-detected from the path extension if omitted
  context:
    type: number
    description: Lines of context before and after each match (ripgrep fallback only)
  limit:
    type: number
    description: Maximum results per file (ripgrep fallback only). 0 = unlimited
