apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: code_index_folder
  description: Index the working directory through the kdeps API
  version: "1.1.0"
interface:
  inputs:
    - name: extensions
      type: array
      description: 'File extensions to index, for example [".md", ".yaml"]. Empty uses the defaults'
    - name: graphDBPath
      type: string
      description: Graph index db path. Empty uses the working folder's data dir
  # body is the handler text. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Index the working directory
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/code_index_folder/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        extensions: "{{ get('code_index_folder.extensions') }}"
        graphDBPath: "{{ get('code_index_folder.graphDBPath') }}"
