version: 1.0.0
description: 'Write to the GitHub REST API: POST a JSON body to https://api.github.com/PATH and return the JSON. Use it to create issues, comments, pull requests and labels. Requires GITHUB_TOKEN, GH_TOKEN or the vault secret github_token.'
parameters:
  path:
    type: string
    description: 'The API path after https://api.github.com/. Examples: repos/OWNER/REPO/issues, repos/OWNER/REPO/issues/NUMBER/comments.'
    required: true
  body:
    type: object
    description: 'The JSON request body. Example for a new issue: {"title": "...", "body": "..."}.'
    required: true
http:
  env:
    TOKEN: [GITHUB_TOKEN, GH_TOKEN, "secret:github_token"]
  method: POST
  # The host is fixed; path only adds to it.
  url: 'https://api.github.com/{{trimPrefix .args.path "/"}}'
  headers:
    Accept: application/vnd.github+json
    Authorization: 'Bearer {{.env.TOKEN}}'
    Content-Type: application/json
    User-Agent: kdeps
    X-GitHub-Api-Version: '2022-11-28'
  body: '{{json .args.body}}'
