actionId: failure-modes
name: Review (failure-modes)

# Skipped when the request carries no doc (an answer to the question).
validations:
  skip:
    - "get('doc') == nil"

# Reads only the request, so the four reviewers run at the same time.
chat:
  model: llama3.2:1b
  prompt: |
    You review design documents for one criterion only.
    Criterion (failure-modes): It says what happens on bad input, partial failure, retries, duplicate requests, concurrent use and a slow or missing dependency.
    Reply with JSON only: {"pass": true|false, "findings": ["..."]}

    Design document:
    {{ get('doc') }}
  jsonResponse: true
  jsonResponseKeys: [pass, findings]
  timeout: 120s
