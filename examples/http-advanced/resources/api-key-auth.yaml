actionId: apiKeyAuth
name: API Key Authentication

validations:
  methods: [POST]
  routes: [/api/v1/http-demo]

component:
  name: http_request
  with:
    method: POST
    url: "https://httpbin.org/post"
    data:
      message: "Hello from KDeps!"
      timestamp: "{{ info('current_time') }}"
      user_id: "{{ get('user_id', '12345') }}"

    headers:
      Content-Type: "application/json"
      X-Custom-Header: "{{ get('custom_header', 'default-value') }}"
      # API key authentication as a request header. Reusable credentials belong
      # in a named connection in ~/.kdeps/config.yaml; reference it with
      # connectionName instead of templating the key here.
      X-API-Key: "{{ get('api_key', 'your-api-key-here') }}"

    # Advanced options
    followRedirects: true
    timeout: 15s

    # Retry with exponential backoff
    retry:
      maxAttempts: 5
      backoff: 500ms
      maxBackoff: 10s
      retryOn: [429, 500, 502, 503]
