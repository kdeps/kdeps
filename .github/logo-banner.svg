<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="kGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00B8D4"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background pill -->
  <rect x="0" y="10" width="400" height="100" rx="20" fill="#0D1117"/>

  <!-- Glowing 'k' as inline path (font-independent, fatter, centered) -->
  <path d="M42 28 L42 56 L42 92 L34 92 L34 28 Z M42 56 L68 28 L78 28 L54 56 L80 92 L70 92 L46 58 Z"
        fill="url(#kGlow)" filter="url(#softGlow)"
        transform="translate(0, 10) scale(1.2)"/>

  <!-- 'deps' -->
  <text x="100" y="82" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace" font-size="64" font-weight="700" fill="#E6EDF3">deps</text>

  <!-- Tagline -->
  <text x="40" y="100" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#8B949E" letter-spacing="2">AI WORKFLOWS · LOCAL FIRST</text>
</svg>
