version: 1.1.0
description: Rerank a list of documents by relevance to a query using VoyageAI's reranking API. Requires VOYAGEAI_API_KEY.
parameters:
  documents:
    type: string
    description: JSON array of document texts to rerank
    required: true
  model:
    type: string
    description: 'VoyageAI rerank model (default: rerank-2)'
    default: rerank-2
  query:
    type: string
    description: The search query to rank documents against
    required: true
  top_n:
    type: number
    description: 'Number of top results to return (default: 5)'
    default: 5
http:
  env:
    API_KEY: [VOYAGEAI_API_KEY]
  method: POST
  url: https://api.voyageai.com/v1/rerank
  headers:
    Content-Type: application/json
    Authorization: "Bearer {{.env.API_KEY}}"
  body: >-
    {"model": {{json .args.model}}, "query": {{json .args.query}},
    "documents": {{json (fromJSON .args.documents)}}, "top_k": {{int .args.top_n}}, "return_documents": true}
  result: |-
    {{- $docs := fromJSON .args.documents -}}
    [{{range $i, $r := .response.data}}{{if $i}},{{end}}
      {"index": {{int $r.index}}, "text": {{json (or $r.document (get $docs $r.index))}}, "score": {{json $r.relevance_score}}}{{end}}
    ]
