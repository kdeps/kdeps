version: 1.1.0
name: search
order: 320
# builtin: kdeps handles this command itself; this file supplies its help,
# aliases and completion.
builtin: true
usage:
  - args: "<term>"
    help: Search the indexed directory and feed the results to the model
  - args: index
    help: Build or update the search index of every folder the project searches
  - args: folders
    help: List the folders the project searches (its own and the ones added)
  - args: "add <folder>"
    help: Search a folder outside the project with it (docs, a shared library); indexes it now
  - args: "remove <folder>"
    help: Stop searching a folder with the project
