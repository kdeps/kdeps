apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: cron_create
  description: Create a cron job through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: expression
      type: string
      required: true
      description: Cron expression (e.g. '0 */6 * * *' for every 6 hours). Standard 5-field POSIX cron.
    - name: name
      type: string
      required: true
      description: Human-readable cron job name
    - name: task_description
      type: string
      required: true
      description: Description template for created tasks
    - name: task_prompt
      type: string
      required: true
      description: Prompt template for the task created when this cron fires
  # body is the created-cron sentence. The HTTP envelope stays inside the call.
  output: "{{ output('call').body }}"
resources:
  - actionId: call
    name: Create cron
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/cron_create/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 30s
      data:
        expression: "{{ get('cron_create.expression') }}"
        name: "{{ get('cron_create.name') }}"
        task_description: "{{ get('cron_create.task_description') }}"
        task_prompt: "{{ get('cron_create.task_prompt') }}"
