apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: jira_get
  description: Read the Jira API through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: path
      type: string
      required: true
      description: 'The API path after /rest/api/3/, with its query string. Examples: issue/KEY-1, search/jql?jql=project=KEY, project.'
  # The Jira reply, parsed from JSON. A missing token is an error that names its sources.
  output: "{{ fromJSON(output('call').body) }}"
resources:
  - actionId: call
    name: Jira GET
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/jira_get/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 60s
      data:
        path: "{{ get('jira_get.path') }}"
