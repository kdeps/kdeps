<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page summarizer</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #0b0b0c; color: #e8e8ea; line-height: 1.5; }
        main { max-width: 720px; margin: 0 auto; padding: 2rem 1rem 4rem; }
        h1 { font-size: 1.5rem; letter-spacing: -0.02em; margin-bottom: 0.35rem; }
        .sub { color: #9aa0a6; font-size: 0.9rem; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: #00e5ff; margin: 1rem 0 0.35rem; }
        textarea { width: 100%; background: #141416; color: #e8e8ea; border: 1px solid rgba(255,255,255,0.08); border-radius: 2px; padding: 0.7rem; font: inherit; min-height: 8rem; resize: vertical; }
        button { display: inline-block; margin-top: 1rem; padding: 0.7rem 1.1rem; background: #00e5ff; color: #0b0b0c; border: 0; border-radius: 2px; font: inherit; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: default; }
        #status { margin-top: 1rem; color: #9aa0a6; font-size: 0.85rem; }
        #out { margin-top: 1.25rem; white-space: pre-wrap; background: #141416; border: 1px solid rgba(255,255,255,0.08); padding: 1rem; min-height: 6rem; }
        /* #kdeps-capture-cta is filled by kdeps-settings.js when the workflow
           sets KDEPS_WASM_CAPTURE - it holds the draggable bookmarklet link. */
        #kdeps-capture-cta { margin-top: 1.25rem; }
    </style>
</head>
<body>
    <main>
        <h1>Page summarizer</h1>
        <p class="sub">This HTML file is the app. Double-click it (no server). Set your backend and API key in the gear menu (top-right), then drag the bookmarklet below onto the bookmarks bar.</p>

        <div id="kdeps-capture-cta"></div>

        <label for="text">Page text</label>
        <textarea id="text" placeholder="Or paste text here and click Summarize."></textarea>
        <button id="run" type="button">Summarize</button>

        <div id="status">Loading WASM...</div>
        <div id="out"></div>
    </main>
    <script>
        var ready = false;
        var textEl = document.getElementById('text');
        var statusEl = document.getElementById('status');
        var outEl = document.getElementById('out');
        var runBtn = document.getElementById('run');

        function summaryFrom(result) {
            if (result == null) return '(empty)';
            if (typeof result === 'string') return result;
            if (result.response && result.response.summary) return result.response.summary;
            if (result.summary) return result.summary;
            if (result.message && result.message.content) return result.message.content;
            return JSON.stringify(result, null, 2);
        }

        async function summarize(input) {
            if (!ready || !window.kdeps) { statusEl.textContent = 'WASM is not ready yet.'; return; }
            if (!window.__kdepsSettingsReady || !window.__kdepsSettingsReady()) {
                statusEl.textContent = 'Open the gear menu (top-right) and set a backend + API key first.';
                return;
            }
            runBtn.disabled = true;
            statusEl.textContent = 'Summarizing...';
            outEl.textContent = '';
            try {
                var result = await window.kdeps.execute(input);
                outEl.textContent = summaryFrom(result);
                statusEl.textContent = 'Done.';
            } catch (err) {
                outEl.textContent = String(err && err.message ? err.message : err);
                statusEl.textContent = 'Failed.';
            }
            runBtn.disabled = false;
        }

        runBtn.addEventListener('click', function () {
            summarize({ text: textEl.value.trim() });
        });

        // The bookmarklet (from kdeps-settings.js) delivers a captured page here.
        window.addEventListener('kdeps:capture', function (ev) {
            var d = ev.detail || {};
            if (d.text) textEl.value = d.text;
            summarize(d);
        });

        window.addEventListener('kdeps:ready', function () {
            ready = true;
            statusEl.textContent = 'Ready. Set your key in the gear menu, then use the bookmarklet or paste text.';
        });
    </script>
</body>
</html>
