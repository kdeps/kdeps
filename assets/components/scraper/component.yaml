apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: scraper
  description: Fetch a web page and return its text, optionally only the elements matching a CSS selector
  version: "1.1.1"
  targetActionId: call
interface:
  inputs:
    - name: url
      type: string
      required: true
      description: Page to fetch (GET)
    - name: selector
      type: string
      default: ""
      description: CSS selector; when set, content is the text of each matching element, one per line
    - name: timeout
      type: string
      default: 30s
      description: Request timeout as a duration (30s, 2m)
  # The result: same fields whatever the page returned; a non-2xx status is
  # reported in status, not raised. The fetch itself is the kdeps API's
  # http_request tool, which returns {statusCode, body, headers}.
  output:
    content: "{{ htmlText(fromJSON(output('call').body).body, get('scraper.selector')) }}"
    url: "{{ get('scraper.url') }}"
    status: "{{ fromJSON(output('call').body).statusCode }}"
resources:
  - actionId: call
    name: Fetch page
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/http_request/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 60s      # the called request's own timeout comes from the timeout input
      data:
        url: "{{ get('scraper.url') }}"
        method: GET
        timeout: "{{ get('scraper.timeout') }}"
