version: 1.0.1
name: goal
order: 210
# builtin: kdeps handles this command itself; this file names the operation
# that runs it in api:, and supplies its help, aliases and completion.
builtin: true
api: goal
usage:
  - args: ""
    help: "Show the active goal's task list and progress"
  - args: "new <text>"
    help: Replace the active goal with a new plan
  - args: skip
    help: Abandon the active task and move to the next
  - args: clear
    help: Drop the active goal (stops task enforcement)
