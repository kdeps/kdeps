version: 1.2.0
# kdeps update installs these with this preset: the events it tunes, the actions they run, and the components whose tools those events limit
requires:
  actions/block: ""
  actions/cap: ""
  actions/compact: ""
  actions/drop_oldest: ""
  actions/truncate: ""
  components/bash_exec: ""
  components/edit_file: ""
  components/exec: ""
  components/list_files: ""
  components/memory_query: ""
  components/memory_search: ""
  components/read_file: ""
  components/search_local: ""
  components/web_scraper: ""
  components/web_search: ""
  components/write_file: ""
  events/auto-compact: ""
  events/bash-call-budget: ""
  events/code-call-budget: ""
  events/efficiency: ""
  events/efficiency-actions: ""
  events/efficiency-bash: ""
  events/efficiency-code: ""
  events/efficiency-failures: ""
  events/efficiency-file: ""
  events/efficiency-reads: ""
  events/efficiency-stops: ""
  events/efficiency-tighten: ""
  events/efficiency-verbose: ""
  events/efficiency-web: ""
  events/file-call-budget: ""
  events/fold: ""
  events/force-answer-digest: ""
  events/history-window-trim: ""
  events/memory-capture-limit: ""
  events/memory-chain-max: ""
  events/memory-focus-max: ""
  events/memory-keys-limit: ""
  events/memory-prompt-limit: ""
  events/memory-search-limit: ""
  events/memory-value-limit: ""
  events/rel-memory-limit: ""
  events/tool-error-truncate: ""
  events/tool-result-truncate: ""
  events/web-call-budget: ""
name: thorough
description: >-
  Maximizes context retention: compacts and folds much less often, injects
  far more memory context, keeps more of every tool result, and allows
  larger tool-call budgets. Best for long research/investigation sessions
  where losing history hurts quality more than the extra tokens cost.
events:
  - name: auto-compact
    on:
      tokens: 80000
      ctxWindowFraction: 0.9
      minTurns: 8
    run: compact
  - name: fold
    on:
      tokensSinceCheckpoint: 4000
      minTurns: 8
    items: 12
    run: compact
  - name: memory-prompt-limit
    on:
      tokens: 1500
    run: truncate
  - name: memory-keys-limit
    items: 300
    run: cap
  - name: memory-focus-max
    items: 15
    run: cap
  - name: memory-chain-max
    items: 20
    run: cap
  - name: rel-memory-limit
    items: 1000
    run: cap
  - name: memory-search-limit
    items: 40
    run: cap
  - name: memory-value-limit
    on:
      bytes: 1000
    run: truncate
  - name: memory-capture-limit
    on:
      bytes: 600
    run: truncate
  - name: tool-result-truncate
    on:
      bytes: 32768
    run: truncate
  - name: tool-error-truncate
    on:
      bytes: 1000
    run: truncate
  - name: force-answer-digest
    on:
      bytes: 24576
    run: truncate
  - name: history-window-trim
    on:
      bytes: 49152
    run: drop_oldest
  - name: web-call-budget
    tools: [web_search, wikipedia, web_scraper, exa_search, wolfram_alpha]
    on:
      distinctCalls: 40
    run: block
  - name: bash-call-budget
    tools: [bash_exec]
    on:
      distinctCalls: 100
    run: block
  - name: file-call-budget
    tools: [read_file, list_files]
    on:
      distinctCalls: 160
    run: block
  - name: code-call-budget
    tools: [search_local]
    on:
      distinctCalls: 60
    run: block
  - name: efficiency
    run: block
  - name: efficiency-verbose
    disabled: true
    run: block
  - name: efficiency-reads
    on:
      rounds: 12
    run: block
  - name: efficiency-actions
    on:
      rounds: 60
    run: block
  - name: efficiency-stops
    on:
      rounds: 4
    run: block
  - name: efficiency-failures
    on:
      rounds: 8
    run: block
  - name: efficiency-tighten
    items: 1
    disabled: true
    run: block
  - name: efficiency-web
    on:
      distinctCalls: 8
    run: block
  - name: efficiency-bash
    on:
      distinctCalls: 15
    run: block
  - name: efficiency-file
    on:
      distinctCalls: 20
    run: block
  - name: efficiency-code
    on:
      distinctCalls: 10
    run: block
