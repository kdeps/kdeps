apiVersion: kdeps.io/v1
kind: Component
metadata:
  name: telegram_get
  description: Read the Telegram Bot API through the kdeps API
  version: "1.0.0"
interface:
  inputs:
    - name: path
      type: string
      required: true
      description: 'The Bot API method, with its query string (getMe, getUpdates?offset=0)'
  # The Telegram reply, parsed from JSON. A missing token is an error that names its sources.
  output: "{{ fromJSON(output('call').body) }}"
resources:
  - actionId: call
    name: Telegram GET
    httpClient:
      method: POST
      # In-process host. The HTTP executor calls the handler without dialing.
      url: http://kdeps.api/apis/tools.kdeps.io/v1/tools/telegram_get/call
      headers:
        Content-Type: application/json
      failOnError: true
      timeout: 60s
      data:
        path: "{{ get('telegram_get.path') }}"
