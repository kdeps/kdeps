version: 1.0.0
description: 'Drive a real browser with Playwright: open a page and run ordered steps - navigate, click, fill, type, upload, select, check, uncheck, hover, scroll, press, clear, evaluate, screenshot, wait - then return the page URL, title and each step''s result. Optional: engine (chromium, firefox or webkit), headless, sessionId (keep cookies and the last page between calls), viewport, timeout, waitFor, userAgent, stealthMode.'
parameters:
  actions:
    type: array
    description: 'Steps in order, e.g. [{action: fill, selector: "#q", value: kdeps}, {action: press, key: Enter}]. Step fields: action (required), selector, value, key, script, files, outputFile, fullPage, wait, url'
  engine:
    type: string
    description: 'chromium (default), firefox or webkit. The engine''s browser downloads on first use'
  headless:
    type: boolean
    description: 'Run without a window. Default: true'
  sessionId:
    type: string
    description: 'Keep cookies, storage and the current page between calls with the same id (under ~/.kdeps/browser-sessions)'
  stealthMode:
    type: boolean
    description: 'Launch flags and context settings that make automation less detectable. Default: false'
  timeout:
    type: string
    description: 'Per-step timeout as a duration. Default: 30s'
  url:
    type: string
    description: 'Page to open first; with a sessionId and no url, the session''s last page'
  userAgent:
    type: string
    description: 'User-Agent override'
  viewport:
    type: object
    description: '{width, height}; default 1280x720'
  waitFor:
    type: string
    description: 'Selector to wait for after the first page loads'
